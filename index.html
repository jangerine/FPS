<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>VECTOR FPS</title>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{
 box-sizing:border-box;
 -webkit-tap-highlight-color:transparent
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#000;
 font-family:Arial,Helvetica,sans-serif;
 touch-action:none
}

#gameCanvas{
 width:100%;
 height:100%;
 display:block;
 outline:none
}

#startScreen,#endScreen{
 position:fixed;
 inset:0;
 z-index:20;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 background:rgba(4,7,12,.94);
 color:#fff;
 text-align:center
}

#endScreen{
 display:none
}

h1{
 font-size:52px;
 letter-spacing:8px;
 margin:0 0 8px
}

.subtitle{
 opacity:.7;
 margin-bottom:28px
}

.modeRow{
 display:flex;
 gap:12px;
 margin-bottom:18px
}

.modeBtn,#startBtn,#restartBtn{
 border:1px solid #fff;
 background:#111;
 color:#fff;
 padding:13px 24px;
 font-size:16px;
 border-radius:7px
}

.modeBtn.selected{
 background:#fff;
 color:#000
}

#startBtn,#restartBtn{
 margin-top:16px;
 min-width:180px;
 cursor:pointer
}

#modeDescription{
 max-width:520px;
 opacity:.7;
 line-height:1.5
}

#hud{
 position:fixed;
 inset:0;
 z-index:5;
 pointer-events:none;
 color:#fff;
 font-weight:bold;
 text-shadow:0 2px 4px #000
}

#topHud{
 position:absolute;
 top:16px;
 left:16px;
 display:flex;
 gap:16px;
 flex-wrap:wrap
}

.stat{
 background:rgba(0,0,0,.45);
 padding:7px 10px;
 border-radius:5px
}

#ammo{
 position:absolute;
 right:20px;
 bottom:18px;
 font-size:34px
}

#hp{
 position:absolute;
 left:20px;
 bottom:20px;
 font-size:24px
}

#crosshair{
 position:absolute;
 left:50%;
 top:50%;
 width:20px;
 height:20px;
 transform:translate(-50%,-50%)
}

#crosshair:before,#crosshair:after{
 content:"";
 position:absolute;
 background:#fff
}

#crosshair:before{
 left:9px;
 top:1px;
 width:2px;
 height:18px
}

#crosshair:after{
 left:1px;
 top:9px;
 width:18px;
 height:2px
}

#scopeOverlay{
 position:fixed;
 inset:0;
 z-index:8;
 display:none;
 pointer-events:none;
 background:rgba(0,0,0,.72);
 overflow:hidden
}

#scopeOverlay.active{display:block}

#scopeCircle{
 position:absolute;
 left:50%;
 top:50%;
 width:min(78vw,78vh);
 height:min(78vw,78vh);
 transform:translate(-50%,-50%);
 border:3px solid rgba(255,255,255,.9);
 border-radius:50%;
 box-shadow:0 0 0 9999px rgba(0,0,0,.72);
 background:transparent
}

#scopeCircle:before{
 content:"";
 position:absolute;
 left:50%;
 top:0;
 width:2px;
 height:100%;
 transform:translateX(-50%);
 background:rgba(255,255,255,.8)
}

#scopeCircle:after{
 content:"";
 position:absolute;
 left:0;
 top:50%;
 width:100%;
 height:2px;
 transform:translateY(-50%);
 background:rgba(255,255,255,.8)
}

#scopeDot{
 position:absolute;
 left:50%;
 top:50%;
 width:5px;
 height:5px;
 transform:translate(-50%,-50%);
 border-radius:50%;
 background:#fff
}

#scopeLabel{
 position:absolute;
 left:50%;
 top:calc(50% + min(39vw,39vh) + 12px);
 transform:translateX(-50%);
 font-size:11px;
 letter-spacing:2px;
 color:rgba(255,255,255,.7)
}

#hitMarker{
 position:absolute;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 font-size:35px;
 opacity:0
}

#mobile{
 display:none;
 position:fixed;
 inset:0;
 z-index:10;
 pointer-events:none
}

#joystickZone{
 position:absolute;
 left:22px;
 bottom:28px;
 width:145px;
 height:145px;
 border:2px solid rgba(255,255,255,.25);
 border-radius:50%;
 pointer-events:auto
}

#joystickKnob{
 position:absolute;
 left:50%;
 top:50%;
 width:58px;
 height:58px;
 margin:-29px;
 border-radius:50%;
 background:rgba(255,255,255,.3)
}

#lookZone{
 position:absolute;
 right:0;
 top:0;
 width:58%;
 height:100%;
 pointer-events:auto
}

#lookLeftZone{
 position:absolute;
 left:0;
 top:0;
 width:42%;
 height:62%;
 pointer-events:auto
}

.mobileBtn{
 position:absolute;
 pointer-events:auto;
 border:1px solid rgba(255,255,255,.5);
 background:rgba(0,0,0,.4);
 color:#fff;
 border-radius:50%;
 font-weight:bold
}

#fireBtn{
 right:28px;
 bottom:42px;
 width:92px;
 height:92px
}

#reloadBtn{
 right:130px;
 bottom:50px;
 width:62px;
 height:62px
}

#runBtn{
 display:none;
 left:185px;
 bottom:44px;
 width:64px;
 height:64px
}

#zoomBtn{
 right:105px;
 bottom:155px;
 width:62px;
 height:62px
}

#weaponOpenBtn{
 right:105px;
 bottom:230px;
 width:62px;
 height:62px
}

#gameSettingsBtn{
 position:fixed;
 top:72px;
 right:12px;
 z-index:25;
 width:48px;
 height:42px;
 border:1px solid rgba(255,255,255,.28);
 border-radius:8px;
 background:rgba(0,0,0,.48);
 color:#fff;
 font-weight:bold;
 display:none
}

#gameSettingsPanel{
 position:fixed;
 top:120px;
 right:12px;
 z-index:26;
 width:min(88vw,300px);
 padding:14px;
 background:rgba(8,12,18,.94);
 border:1px solid rgba(255,255,255,.22);
 border-radius:10px;
 color:#fff;
 display:none;
 box-shadow:0 12px 40px rgba(0,0,0,.55)
}

#gameSensitivityRange{ width:100% }

#settingsBox{
 margin-top:14px;
 width:min(92vw,460px);
 background:rgba(255,255,255,.05);
 border:1px solid rgba(255,255,255,.18);
 border-radius:8px;
 padding:12px
}

#sensitivityRange{
 width:100%
}

#weaponSelect{
 position:fixed;
 inset:0;
 z-index:30;
 display:none;
 align-items:center;
 justify-content:center;
 background:rgba(0,0,0,.72);
 color:#fff;
 pointer-events:auto
}

#weaponSelectBox{
 width:min(92vw,430px);
 padding:22px;
 background:linear-gradient(145deg,#101823,#080c12);
 border:1px solid rgba(90,190,230,.35);
 border-radius:16px;
 text-align:center;
 box-shadow:0 18px 60px rgba(0,0,0,.65)
}

.weaponGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-top:16px
}

.weaponBtn{
 padding:16px 8px;
 border:1px solid #777;
 background:#181c25;
 color:#fff;
 border-radius:8px;
 font-weight:bold
}

.weaponBtn.selected{
 border-color:#fff;
 background:#fff;
 color:#000
}

#jumpBtn{
 right:28px;
 bottom:155px;
 width:62px;
 height:62px
}

#mpPanel{
 margin-top:16px;
 width:min(92vw,460px)
}

#roomCode{
 user-select:text
}

#roomInput{
 text-transform:uppercase
}

@media(pointer:coarse),(max-width:900px){

 #mobile{
  display:block
 }

 #gameSettingsBtn{
  display:block
 }

 h1{
  font-size:38px
 }

}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<div id="startScreen">

 <h1>VECTOR FPS</h1>

 <div class="subtitle">
  TACTICAL 3D SHOOTER
 </div>

 <div class="modeRow">

  <button
   id="roundMode"
   class="modeBtn selected"
  >
   ROUND
  </button>

  <button
   id="deathmatchMode"
   class="modeBtn"
  >
   DEATHMATCH
  </button>

  <button
   id="trainingMode"
   class="modeBtn"
  >
   TRAINING
  </button>

 </div>

 <div id="modeDescription">
  적을 모두 처치하면 다음 라운드로 진행합니다.
 </div>

 <div
  id="mpPanel"
  style="display:none"
 >

  <div
   style="
    font-size:13px;
    opacity:.7;
    margin-bottom:8px
   "
  >
   DEATHMATCH ROOM
  </div>

  <div
   style="
    display:flex;
    gap:8px
   "
  >

   <button
    id="hostBtn"
    class="modeBtn selected"
    style="flex:1"
   >
    HOST
   </button>

   <button
    id="joinBtn"
    class="modeBtn"
    style="flex:1"
   >
    JOIN
   </button>

  </div>

  <div
   id="roomBox"
   style="display:none;margin-top:10px"
  >

   <div
    style="
     font-size:12px;
     opacity:.65
    "
   >
    친구에게 아래 ROOM CODE를 보내세요.
   </div>

   <div
    id="roomCode"
    style="
     font-size:24px;
     font-weight:bold;
     letter-spacing:3px;
     margin:6px 0
    "
   ></div>

  </div>

  <div
   id="joinBox"
   style="display:none;margin-top:10px"
  >

   <input
    id="roomInput"
    autocomplete="off"
    placeholder="HOST ROOM CODE"
    style="
     width:100%;
     padding:12px;
     border-radius:7px;
     border:1px solid #555;
     background:#080808;
     color:#fff;
     text-align:center
    "
   >

  </div>

  <div
   id="connectionStatus"
   style="
    margin-top:8px;
    font-size:12px;
    opacity:.65
   "
  >
   HOST를 선택하면 방 코드가 생성됩니다.
  </div>

 </div>

 <div id="settingsBox">
  <div style="display:flex;justify-content:space-between;gap:12px">
   <span>MOBILE SENSITIVITY</span>
   <span id="sensitivityValue">1.00x</span>
  </div>
  <input id="sensitivityRange" type="range" min="0.50" max="2.00" step="0.05" value="1.00">
 </div>

 <button id="startBtn">
  START MATCH
 </button>

</div>

<div id="endScreen">

 <h1 id="endTitle">
  MATCH OVER
 </h1>

 <div id="endText"></div>

 <button id="restartBtn">
  RESTART
 </button>

</div>

<div id="hud">

 <div id="topHud">

  <div class="stat">
   MODE <span id="hudMode">ROUND</span>
  </div>

  <div class="stat">
   ROUND <span id="hudRound">1</span>
  </div>

  <div class="stat">
   PLAYERS <span id="hudEnemies">0</span>
  </div>

  <div class="stat">
   KILLS <span id="hudKills">0</span>
  </div>

  <div class="stat">
   TIME <span id="hudTime">--:--</span>
  </div>

 </div>

 <div id="hp">
  HP 100
 </div>

 <div id="ammo">
  12 / 60
 </div>

 <div id="crosshair"></div>

 <div id="hitMarker">
  ×
 </div>

</div>

<div id="scopeOverlay">
 <div id="scopeCircle">
  <div id="scopeDot"></div>
 </div>
 <div id="scopeLabel">SCOPE</div>
</div>

<button id="gameSettingsBtn" type="button">⚙</button>

<div id="gameSettingsPanel">
 <div style="display:flex;justify-content:space-between;gap:12px;margin-bottom:8px">
  <span>감도</span>
  <span id="gameSensitivityValue">1.00x</span>
 </div>
 <input id="gameSensitivityRange" type="range" min="0.50" max="2.00" step="0.05" value="1.00">
 <button id="gameSettingsClose" type="button" style="margin-top:10px;width:100%;padding:9px;border-radius:7px;border:1px solid #555;background:#171b22;color:#fff">닫기</button>
</div>

<div id="mobile">

 <div id="lookZone"></div>

 <div id="lookLeftZone"></div>

 <div id="joystickZone">

  <div id="joystickKnob"></div>

 </div>

 <button
  id="runBtn"
  class="mobileBtn"
 >
  RUN
 </button>

 <button
  id="jumpBtn"
  class="mobileBtn"
 >
  JUMP
 </button>

 <button
  id="reloadBtn"
  class="mobileBtn"
 >
  R
 </button>

 <button
  id="fireBtn"
  class="mobileBtn"
 >
  FIRE
 </button>

 <button
  id="zoomBtn"
  class="mobileBtn"
 >
  SCOPE
 </button>

 <button
  id="weaponOpenBtn"
  class="mobileBtn"
 >
  WEAPON
 </button>

</div>

<div id="weaponSelect">
 <div id="weaponSelectBox">
  <div id="weaponSelectKicker" style="font-size:12px;opacity:.65">LOADOUT</div>
  <h2 id="weaponSelectTitle" style="margin:7px 0">CHOOSE WEAPON</h2>
  <div id="weaponSelectDesc" style="font-size:12px;opacity:.65">다음 라운드에 사용할 총을 선택하세요.</div>
  <div class="weaponGrid">
   <button class="weaponBtn" data-weapon="rifle">RIFLE<br><small>균형형</small></button>
   <button class="weaponBtn" data-weapon="smg">SMG<br><small>빠른 연사</small></button>
   <button class="weaponBtn" data-weapon="shotgun">SHOTGUN<br><small>근거리 산탄</small></button>
   <button class="weaponBtn" data-weapon="sniper">SNIPER<br><small>정밀 사격</small></button>
  </div>
 </div>
</div>

<script>
"use strict";

/* =========================================================
   ENGINE
========================================================= */

const canvas=
 document.getElementById(
  "gameCanvas"
 );

const engine=
 new BABYLON.Engine(
  canvas,
  true,
  {
   antialias:true,
   adaptToDeviceRatio:true
  }
 );

let scene;
let camera;

/* =========================================================
   GAME STATE
========================================================= */

let gameMode="round";

let gameStarted=false;
let gameOver=false;

let playerDead=false;

let playerHP=100;

let round=1;

let kills=0;

let deathmatchTime=300;

let respawnTimer=0;

const DEATHMATCH_TIME=300;
const DEATHMATCH_KILLS=30;
const TRAINING_BOT_COUNT=6;

/* =========================================================
   MULTIPLAYER
========================================================= */

let peer=null;

let hostPeerId="";

let myPeerId="";

let isHost=false;

let multiplayerConnected=false;

let hostConnection=null;

const peerConnections=
 new Map();

const remotePlayers=
 new Map();

let lastNetworkSend=0;

let networkReady=false;

const NETWORK_SEND_RATE=50;

/* =========================================================
   PLAYER
========================================================= */

const MAG_SIZE=12;

const WEAPONS={
 rifle:{name:"RIFLE",fireDelay:145,bodyDamage:34,headDamage:100,pellets:1,spread:0,zoom:.72},
 smg:{name:"SMG",fireDelay:110,bodyDamage:30,headDamage:95,pellets:1,spread:.006,zoom:.78},
 shotgun:{name:"SHOTGUN",fireDelay:520,bodyDamage:8,headDamage:11,pellets:6,spread:.055,zoom:.83},
 sniper:{name:"SNIPER",fireDelay:650,bodyDamage:58,headDamage:100,pellets:1,spread:0,zoom:.42}
};

let currentWeapon="rifle";
let zoomed=false;
let sensitivity=Number(localStorage.getItem("vectorSensitivity")||"1");
let weaponSelectionOpen=false;

let ammo=MAG_SIZE;

let reserve=60;

let lastShot=0;

let firing=false;

let reloading=false;

/* =========================================================
   MOVEMENT
========================================================= */

/*
  기존 달리기 속도 3.4보다
  조금 더 빠른 속도를 기본 이동속도로 변경.
*/

const WALK_SPEED=3.8;

const RUN_SPEED=4.9;

const GROUND_Y=1.7;

const JUMP_POWER=5.0;

const GRAVITY=14;

let velocityY=0;

let onGround=true;

let moveForward=false;
let moveBackward=false;
let moveLeft=false;
let moveRight=false;

let running=false;

/* =========================================================
   COLLISION
========================================================= */

const collisionMeshes=[];

const PLAYER_RADIUS=.42;

const ENEMY_RADIUS=.42;

/* =========================================================
   MOBILE
========================================================= */

let joystickX=0;

let joystickY=0;

let joystickActive=false;

let joystickPointerId=null;

let lookActive=false;

let lookPointerId=null;

let lastLookX=0;

let lastLookY=0;

/* =========================================================
   RECOIL
========================================================= */

/*
  기존보다 강한 반동.

  자동 복귀하지 않는다.
  따라서 연사 중 손가락/마우스로
  아래쪽으로 직접 내려서 반동을 잡는다.
*/

const RECOIL_PER_SHOT=.035;

const MAX_RECOIL_PITCH=1.00;

const RECOIL_SIDE=.008;

/* =========================================================
   ENEMIES
========================================================= */

const enemies=[];

/*
  ROUND 모드에서만 사용.
  DEATHMATCH에는 봇을 만들지 않는다.
*/

const DEATHMATCH_ENEMY_COUNT=0;

/* =========================================================
   REMOTE PLAYER
========================================================= */

const REMOTE_PLAYER_RADIUS=.45;

/* =========================================================
   SPAWN POINTS
========================================================= */

const spawnPoints=[
 [-42,-42],[42,-42],[-42,42],[42,42],
 [-36,0],[36,0],[0,-36],[0,36],
 [-18,-34],[18,-34],[-18,34],[18,34]
];

/* =========================================================
   UI
========================================================= */

const startScreen=
 document.getElementById(
  "startScreen"
 );

const endScreen=
 document.getElementById(
  "endScreen"
 );

const startBtn=
 document.getElementById(
  "startBtn"
 );
const trainingModeButton=document.getElementById("trainingMode");
const roundModeButton=document.getElementById("roundMode");
const deathmatchModeButton=document.getElementById("deathmatchMode");
const modeDescription=document.getElementById("modeDescription");
const mpPanel=document.getElementById("mpPanel");

const restartBtn=
 document.getElementById(
  "restartBtn"
 );




const hostBtn=
 document.getElementById(
  "hostBtn"
 );

const joinBtn=
 document.getElementById(
  "joinBtn"
 );

const roomBox=
 document.getElementById(
  "roomBox"
 );

const roomCode=
 document.getElementById(
  "roomCode"
 );

const joinBox=
 document.getElementById(
  "joinBox"
 );

const roomInput=
 document.getElementById(
  "roomInput"
 );

const connectionStatus=
 document.getElementById(
  "connectionStatus"
 );

let mpRole="host";

/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(sec){

 sec=Math.max(
  0,
  Math.ceil(sec)
 );

 const m=
  Math.floor(
   sec/60
  )
  .toString()
  .padStart(2,"0");

 const s=
  (sec%60)
   .toString()
   .padStart(2,"0");

 return(
  m+
  ":"+
  s
 );

}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

 document.getElementById(
  "hudMode"
 ).textContent=
  gameMode.toUpperCase();

 document.getElementById(
  "hudRound"
 ).textContent=
  round;

 let playerCount=0;

 if(gameMode==="deathmatch"){

  /*
    자신 + 연결된 상대
  */

  playerCount=
   1+
   remotePlayers.size;

 }else{

  playerCount=
   enemies.filter(
    e=>!e.dead
   ).length;

 }

 document.getElementById(
  "hudEnemies"
 ).textContent=
  playerCount;

 document.getElementById(
  "hudKills"
 ).textContent=
  kills;

 document.getElementById(
  "hudTime"
 ).textContent=
  gameMode==="deathmatch"
   ?formatTime(deathmatchTime)
   :gameMode==="training"
    ?"∞"
    :"--:--";

 document.getElementById(
  "hp"
 ).textContent=
  `HP ${Math.max(0,Math.ceil(playerHP))}`;

 document.getElementById(
  "ammo"
 ).textContent=
  reloading
   ?"RELOAD"
   :
   `${ammo} / ${
    gameMode==="deathmatch"
     ?"∞"
     :reserve
   }`;

}

/* =========================================================
   MATERIAL
========================================================= */

function mat(
 name,
 color
){

 const m=
  new BABYLON.StandardMaterial(
   name,
   scene
  );

 m.diffuseColor=
  new BABYLON.Color3(
   color[0],
   color[1],
   color[2]
  );

 return m;

}

/* =========================================================
   CREATE SCENE
========================================================= */

function createScene(){

 scene=
  new BABYLON.Scene(
   engine
  );

 scene.clearColor=
  new BABYLON.Color4(
   .035,
   .045,
   .06,
   1
  );

 /* =====================================================
    CAMERA
 ===================================================== */

 camera=
  new BABYLON.UniversalCamera(
   "playerCamera",
   new BABYLON.Vector3(
    0,
    GROUND_Y,
    -25
   ),
   scene
  );

 camera.minZ=.05;

 camera.fov=.9;

 camera.speed=0;

 /*
   카메라 관성 제거.
 */

 camera.inertia=0;

 camera.attachControl(
  canvas,
  false
 );

 /* =====================================================
    LIGHT
 ===================================================== */

 const light=
  new BABYLON.HemisphericLight(
   "mainLight",
   new BABYLON.Vector3(
    0,
    1,
    0
   ),
   scene
  );

 light.intensity=1.1;

 const sun=
  new BABYLON.DirectionalLight(
   "sun",
   new BABYLON.Vector3(
    -.4,
    -1,
    -.3
   ),
   scene
  );

 sun.position=
  new BABYLON.Vector3(
   20,
   30,
   20
  );

 sun.intensity=.7;

 /* =====================================================
    MATERIALS
 ===================================================== */

 const floorMat=
  mat(
   "floor",
   [.13,.15,.18]
  );

 const wallMat=
  mat(
   "wall",
   [.92,.92,.92]
  );

 const coverMat=
  mat(
   "cover",
   [.20,.23,.28]
  );

 const enemyBodyMat=
  mat(
   "enemyBody",
   [.75,.12,.12]
  );

 const enemyHeadMat=
  mat(
   "enemyHead",
   [.95,.35,.25]
  );

 const remoteBodyMat=
  mat(

/* =========================================================
   COLLISION
========================================================= */

function circleHitsMesh(
 x,
 z,
 radius,
 mesh
){

 if(
  !mesh ||
  mesh.isDisposed()
 )return false;

 const info=
  mesh.getBoundingInfo()
   .boundingBox;

 const hx=
  info.extendSizeWorld.x;

 const hz=
  info.extendSizeWorld.z;

 const cx=
  info.centerWorld.x;

 const cz=
  info.centerWorld.z;

 const closestX=
  Math.max(
   cx-hx,
   Math.min(
    x,
    cx+hx
   )
  );

 const closestZ=
  Math.max(
   cz-hz,
   Math.min(
    z,
    cz+hz
   )
  );

 const dx=
  x-closestX;

 const dz=
  z-closestZ;

 return(
  dx*dx+
  dz*dz<
  radius*radius
 );

}

function blockedAt(
 x,
 z,
 radius
){

 for(
  const mesh of collisionMeshes
 ){

  if(
   circleHitsMesh(
    x,
    z,
    radius,
    mesh
   )
  ){

   return true;

  }

 }

 return false;

}

function moveWithCollision(
 position,
 dx,
 dz,
 radius
){

 const nextX=
  position.x+
  dx;

 const nextZ=
  position.z+
  dz;

 if(
  !blockedAt(
   nextX,
   position.z,
   radius
  )
 ){

  position.x=
   nextX;

 }

 if(
  !blockedAt(
   position.x,
   nextZ,
   radius
  )
 ){

  position.z=
   nextZ;

 }

 position.x=
  Math.max(
   -32,
   Math.min(
    32,
    position.x
   )
  );

 position.z=
  Math.max(
   -32,
   Math.min(
    32,
    position.z
   )
  );

}

function cleanupMultiplayer(){

 for(
  const c of peerConnections.values()
 ){

  try{
   c.close();
  }catch(e){}

 }

 peerConnections.clear();

 for(
  const p of remotePlayers.values()
 ){

  disposeRemotePlayer(

  );

 }

 remotePlayers.clear();

 if(hostConnection){

  try{

  }catch(e){}

  hostConnection=null;

 if(peer){

  try{

  }catch(e){}

function sendPeer(
 conn,
 data
){

 try{

  if(
   conn &&
   conn.open
  ){

   conn.send(
    data
   );

  }

 }catch(e){}

}

function broadcastHost(
 data,
 exceptId=null
){

 for(
  const [id,c]
  of peerConnections
 ){

  if(id===exceptId)
   continue;

  sendPeer(
   c,
   data
  );

 }

}

function setupPeerConnection(
 conn
){

 if(!conn)return;

 conn.on(
  "open",
  ()=>{

   peerConnections.set(
    conn.peer,
    conn
   );

   if(!isHost){

    hostConnection=
     conn;

   }

   multiplayerConnected=
    true;

   setConnectionStatus(
    isHost
     ?"상대 플레이어 접속을 기다리는 중..."
     :"호스트에 연결되었습니다."
   );

   sendPeer(
    conn,
    {
     type:"hello",
     id:myPeerId
    }
   );

  }
 );

 conn.on(
  "data",
  data=>{

   if(
    !data ||
    typeof data.type!=="string"
   )return;

   handleNetworkMessage(
    conn,
    data
   );

  }
 );

 conn.on(
  "close",
  ()=>{

   peerConnections.delete(
    conn.peer
   );

   removeRemotePlayer(
    conn.peer
   );

   if(
    !isHost &&
    conn===hostConnection
   ){

    multiplayerConnected=
     false;

    networkReady=
     false;

    setConnectionStatus(
     "호스트 연결이 끊어졌습니다."
    );

   }

  }
 );

 conn.on(
  "error",
  ()=>{

   if(!isHost){

    setConnectionStatus(
     "연결 오류. ROOM CODE를 확인하세요."
    );

   }

  }
 );

}

 );

 try{

 peer.on(

 peer.on(

function makeRemotePlayer(
 id
){

 if(
  remotePlayers.has(id)
 ){

  return remotePlayers.get(
   id
  );

 }

 const root=
  new BABYLON.TransformNode(
   "remote_"+id,
   scene
  );

 const body=
  BABYLON.MeshBuilder.CreateBox(
   "remoteBody_"+id,
   {
    width:.8,
    height:1.4,
    depth:.55
   },
   scene
  );

 body.parent=root;

 body.position.y=.9;

 body.material=
  scene.getMaterialByName(
   "remoteBody"
  );

 const head=
  BABYLON.MeshBuilder.CreateSphere(
   "remoteHead_"+id,
   {
    diameter:.55
   },
   scene
  );

 head.parent=root;

 head.position.y=1.85;

 head.material=
  scene.getMaterialByName(
   "remoteHead"
  );

 const player={
  id,
  root,
  body,
  head,
  hp:100,
  dead:false,
  kills:0,
  x:0,
  y:GROUND_Y,
  z:0,
  rx:0,
  ry:0,
  rz:0
 };

 remotePlayers.set(
  id,
  player
 );

 return player;

}

function disposeRemotePlayer(
 player
){

 if(!player)return;

 try{

  player.root.dispose();

 }catch(e){}

}

function removeRemotePlayer(
 id
){

 const p=
  remotePlayers.get(
   id
  );

 if(p){

  disposeRemotePlayer(
   p
  );

 }

 remotePlayers.delete(
  id
 );

 updateHUD();

}

/* =========================================================
   MULTIPLAYER STATE
========================================================= */

function handleHostPlayerState(
 s
){

 if(
  !s ||
  !s.id ||
  s.id===myPeerId
 )return;

 const p=
  makeRemotePlayer(
   s.id
  );

 p.x=
  Number(s.x)||0;

 p.y=
  Number(s.y)||GROUND_Y;

 p.z=
  Number(s.z)||0;

 p.rx=
  Number(s.rx)||0;

 p.ry=
  Number(s.ry)||0;

 p.rz=
  Number(s.rz)||0;

 p.hp=
  Math.max(
   0,
   Number(s.hp)||0
  );

 p.dead=
  !!s.dead;

 p.kills=
  Number(s.kills)||0;

 p.root.setEnabled(
  !p.dead
 );

}

function applyRemoteState(
 list
){

 if(
  !Array.isArray(list)
 )return;

 const seen=
  new Set();

 for(
  const s of list
 ){

  if(!s)
   continue;

  if(
   s.id===myPeerId
  ){

   if(
    typeof s.kills==="number"
   ){

    kills=
     s.kills;

   }

   if(
    typeof s.hp==="number"
   ){

    playerHP=
     Math.max(
      0,
      s.hp
     );

   }

   continue;

  }

  seen.add(
   s.id
  );

  const p=
   makeRemotePlayer(
    s.id
   );

  p.x=
   Number(s.x)||0;

  p.y=
   Number(s.y)||GROUND_Y;

  p.z=
   Number(s.z)||0;

  p.rx=
   Number(s.rx)||0;

  p.ry=
   Number(s.ry)||0;

  p.rz=
   Number(s.rz)||0;

  p.hp=
   Number(s.hp)||0;

  p.dead=
   !!s.dead;

  p.kills=
   Number(s.kills)||0;

  p.root.setEnabled(
   !p.dead
  );

 }

 for(
  const [id,p]
  of remotePlayers
 ){

  if(
   !seen.has(id)
  ){

   disposeRemotePlayer(
    p
   );

   remotePlayers.delete(
    id
   );

  }

 }

}

function getMultiplayerSpawn(
 id
){

 const candidates=
  spawnPoints.slice();

 let seed=0;

 for(
  const ch of String(id||"")
 ){

  seed=
   (
    seed+
    ch.charCodeAt(0)
   )%10000;

 }

 return candidates[
  seed%candidates.length
 ];

}

/* =========================================================
   MULTIPLAYER HIT DETECTION
========================================================= */

function findPlayerHit(
 origin,
 dir,
 excludeId
){

 let best=null;

 let bestT=Infinity;

 const targets=[];

 if(
  excludeId!==myPeerId &&
  !playerDead
 ){

  targets.push(
   {
    id:myPeerId,
    x:camera.position.x,
    y:camera.position.y,
    z:camera.position.z,
    dead:playerDead
   }
  );

 }

 for(
  const [id,p]
  of remotePlayers
 ){

  if(
   id===excludeId ||
   p.dead
  )continue;

  targets.push(
   {
    id,
    x:p.x,
    y:p.y,
    z:p.z,
    dead:p.dead
   }
  );

 }

 for(
  const t of targets
 ){

  if(t.dead)
   continue;

  const points=[
   {
    x:t.x,
    y:t.y+1.85,
    z:t.z,
    part:"head",
    r:.48
   },
   {
    x:t.x,
    y:t.y+.95,
    z:t.z,
    part:"body",
    r:.78
   }
  ];

  for(
   const pt of points
  ){

   const vx=
    pt.x-
    origin.x;

   const vy=
    pt.y-
    origin.y;

   const vz=
    pt.z-
    origin.z;

   const along=
    vx*dir.x+
    vy*dir.y+
    vz*dir.z;

   if(
    along<0 ||
    along>150
   )continue;

   const cx=
    origin.x+
    dir.x*
    along;

   const cy=
    origin.y+
    dir.y*
    along;

   const cz=
    origin.z+
    dir.z*
    along;

   const d2=
    (pt.x-cx)**2+
    (pt.y-cy)**2+
    (pt.z-cz)**2;

   if(
    d2<=pt.r*pt.r &&
    along<bestT
   ){

    bestT=
     along;

    best={
     id:t.id,
     part:pt.part
    };

   }

  }

 }

 return best;

}

/* =========================================================
   HOST PROCESS SHOT
========================================================= */

function hostProcessShot(data){
 if(!gameStarted||gameOver)return;
 const shooterId=data.shooterId;
 if(!shooterId)return;
 const weapon=WEAPONS[data.weapon]||WEAPONS.rifle;
 const origin=data.origin;
 if(!origin)return;
 const dirs=Array.isArray(data.dirs)&&data.dirs.length?data.dirs:[data.dir];
 const totalDamage=new Map();
 const hitParts=new Map();
 for(const raw of dirs){
  if(!raw)continue;
  const len=Math.hypot(raw.x,raw.y,raw.z)||1;
  const nd={x:raw.x/len,y:raw.y/len,z:raw.z/len};
  const hit=findPlayerHit(origin,nd,shooterId);
  if(!hit)continue;
  const damage=hit.part==="head"?weapon.headDamage:weapon.bodyDamage;
  totalDamage.set(hit.id,(totalDamage.get(hit.id)||0)+damage);
  hitParts.set(hit.id,hit.part);
 }
 for(const [targetId,damage] of totalDamage){
  let targetPlayer=null;
  if(targetId===myPeerId){
   if(playerDead)continue;
   playerHP=Math.max(0,playerHP-damage);
   targetPlayer={id:myPeerId,hp:playerHP,dead:playerHP<=0};
   if(playerHP<=0)hostPlayerKilled(shooterId);
  }else{
   const target=remotePlayers.get(targetId);
   if(!target||target.dead)continue;
   target.hp=Math.max(0,target.hp-damage);
   targetPlayer={id:targetId,hp:target.hp,dead:target.hp<=0};
   if(target.hp<=0)hostRemoteKilled(targetId,shooterId);
  }
  if(targetPlayer){
   broadcastHost({type:"playerDamage",targetId:targetPlayer.id,hp:targetPlayer.hp,dead:targetPlayer.dead});
  }
 }
 if(totalDamage.size){
  if(shooterId!==myPeerId)sendPeer(peerConnections.get(shooterId),{type:"hit"});
  else showHitMarker();
 }
}

/* =========================================================
   NETWORK MESSAGE
========================================================= */

function handleNetworkMessage(
 conn,
 data
){

 if(isHost){

  if(
   data.type==="hello"
  ){

   const id=
    data.id||
    conn.peer;

   const p=
    makeRemotePlayer(
     id
    );

   p.x=0;

   p.y=GROUND_Y;

   p.z=0;

   p.hp=100;

   p.dead=false;

   setConnectionStatus(
    "플레이어 "+
    peerConnections.size+
    "명 접속"
   );

   sendPeer(
    conn,
    {
     type:"welcome",
     id:myPeerId,
     time:deathmatchTime
    }
   );

   sendPeer(
    conn,
    {
     type:"state",
     players:buildHostState(),
     time:deathmatchTime
    }
   );

   return;

  }

  if(
   data.type==="state"
  ){

   handleHostPlayerState(
    data
   );

   return;

  }

  if(
   data.type==="shoot"
  ){

   hostProcessShot(
    data
   );

   return;

  }

  if(
   data.type==="respawnReady"
  ){

   const p=
    remotePlayers.get(
     data.id
    );

   if(p){

    const spawn=
     getMultiplayerSpawn(
      data.id
     );

    p.x=spawn[0];

    p.y=GROUND_Y;

    p.z=spawn[1];

    p.rx=0;

    p.ry=0;

    p.rz=0;

    p.hp=100;

    p.dead=false;

   }

   return;

  }

 }else{

  if(
   data.type==="welcome"
  ){

   networkReady=true;

   multiplayerConnected=true;

   setConnectionStatus(
    "멀티플레이 연결 완료"
   );

   return;

  }

  if(
   data.type==="state"
  ){

   applyRemoteState(
    data.players
   );

   if(
    typeof data.time==="number"
   ){

    deathmatchTime=
     data.time;

   }

   updateHUD();

   return;

  }

  if(
   data.type==="hit"
  ){

   showHitMarker();

   return;

  }

  if(
   data.type==="playerDamage"
  ){

   if(
    data.targetId===
    myPeerId
   ){

    playerHP=
     Math.max(
      0,
      Number(data.hp)||0
     );

    if(
     playerHP<=0 &&
     !playerDead
    ){

     playerDeath();

    }

    updateHUD();

   }

   return;

  }

  if(
   data.type==="matchEnd"
  ){

   finishDeathmatch(
    data.reason||
    "MATCH END",
    false
   );

   return;

  }

 }

}

 }

function getSpawnPoint(){

 const available=
  spawnPoints
   .map(
    p=>({

     p,

     distance:
      Math.hypot(
       p[0]-
        camera.position.x,
       p[1]-
        camera.position.z
      )

    })
   )
   .sort(
    (a,b)=>
     b.distance-
     a.distance
   );

 const candidates=
  available.slice(
   0,
   Math.min(
    4,
    available.length
   )
  );

 return candidates[
  Math.floor(
   Math.random()*
   candidates.length
  )
 ].p;

}

 ){

/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(
 dt
){

 if(
  !gameStarted ||
  gameOver ||
  playerDead
 )return;

 let forward=0;

 let strafe=0;

 if(moveForward)
  forward++;

 if(moveBackward)
  forward--;

 if(moveRight)
  strafe++;

 if(moveLeft)
  strafe--;

 forward+=
  joystickY;

 strafe+=
  joystickX;

 const len=
  Math.hypot(
   forward,
   strafe
  );

 if(len>1){

  forward/=len;

  strafe/=len;

 }

 const mobileSprint=
  joystickY>=.90 &&
  Math.abs(joystickX)<.45;

 const speed=
  running || mobileSprint
   ?RUN_SPEED
   :WALK_SPEED;

 const yaw=
  camera.rotation.y;

 const forwardX=
  Math.sin(yaw);

 const forwardZ=
  Math.cos(yaw);

 const rightX=
  Math.cos(yaw);

 const rightZ=
  -Math.sin(yaw);

 moveWithCollision(
  camera.position,
  (
   forwardX*forward+
   rightX*strafe
  )*
  speed*
  dt,
  (
   forwardZ*forward+
   rightZ*strafe
  )*
  speed*
  dt,
  PLAYER_RADIUS
 );

 const highZones=[
  [-28,22,6,5], [28,-22,6,5],
  [28,22,6,5], [-28,-22,6,5]
 ];
 let platformTop=null;
 for(const z of highZones){
  if(Math.abs(camera.position.x-z[0])<=z[2] && Math.abs(camera.position.z-z[1])<=z[3]){
   platformTop=4; break;
  }
 }
 velocityY-=GRAVITY*dt;

 camera.position.y+=
  velocityY*
  dt;

 if(platformTop!==null && camera.position.y<=platformTop && velocityY<=0){
  camera.position.y=platformTop;
  velocityY=0;
  onGround=true;
 }else if(
  camera.position.y<=
  GROUND_Y
 ){

  camera.position.y=
   GROUND_Y;

  velocityY=0;

  onGround=true;

 }else{

  onGround=false;

 }

}

 const base=camera.getForwardRay(100).direction.normalize();
 const dirs=[];
 const right=new BABYLON.Vector3(Math.cos(camera.rotation.y),0,-Math.sin(camera.rotation.y)).normalize();
 const up=BABYLON.Vector3.Cross(right,base).normalize();
 for(let i=0;i<weapon.pellets;i++){
  const sx=(Math.random()-.5)*weapon.spread;
  const sy=(Math.random()-.5)*weapon.spread;
  dirs.push(base.add(right.scale(sx)).add(up.scale(sy)).normalize());
 }
 return dirs;
}

function shoot(){

 if(!gameStarted || gameOver || playerDead || reloading)return;
 const now=performance.now();
 if(now-lastShot<WEAPONS[currentWeapon].fireDelay)return;
 if(ammo<=0){reload();return;}
 lastShot=now;
 ammo--;
 applyRecoil();
 muzzleFlash();
 const dirs=buildShotDirections();

 if(gameMode==="deathmatch"){
  const data={
   type:"shoot",shooterId:myPeerId,weapon:currentWeapon,
   origin:{x:camera.position.x,y:camera.position.y,z:camera.position.z},
   dirs:dirs.map(d=>({x:d.x,y:d.y,z:d.z}))
  };
  if(isHost)hostProcessShot(data);
  else sendPeer(hostConnection,data);
 }else{
  let didHit=false;
  for(const dir of dirs){
   const ray=new BABYLON.Ray(camera.position.clone(),dir,100);
   const hit=scene.pickWithRay(ray,mesh=>!!mesh.metadata&&!!mesh.metadata.enemy);
   if(hit.hit&&hit.pickedMesh){
    const enemy=hit.pickedMesh.metadata.enemy;
    if(!enemy.dead){
     const part=hit.pickedMesh.metadata.hitPart;
     const weapon=WEAPONS[currentWeapon];
     enemy.hp-=part==="head"?weapon.headDamage:weapon.bodyDamage;
     didHit=true;
     if(enemy.hp<=0){killEnemy(enemy);break;}
    }
   }
  }
  if(didHit)showHitMarker();
 }
 updateHUD();
}

/* =========================================================
   RELOAD
========================================================= */

function reload(){

 if(
  reloading ||
  gameOver ||
  playerDead ||
  !gameStarted
 )return;

 if(
  gameMode==="deathmatch"
 ){

  if(
   ammo>=MAG_SIZE
  )return;

 }else{

  if(
   ammo>=MAG_SIZE ||
   reserve<=0
  )return;

 }

 reloading=true;

 setTimeout(
  ()=>{

   if(
    gameMode==="deathmatch"
   ){

    ammo=
     MAG_SIZE;

   }else{

    const need=
     MAG_SIZE-ammo;

    const amount=
     Math.min(
      need,
      reserve
     );

    ammo+=
     amount;

    reserve-=
     amount;

   }

   reloading=false;

   updateHUD();

  },
  850
 );

}

function killEnemy(
 enemy
){

 if(
  !enemy ||
  enemy.dead
 )return;

 enemy.dead=true;

 enemy.deathTimer=0;
 enemy.trainingRespawnQueued=(gameMode==="training");

 kills++;

}

/* =========================================================
   ENEMY AI
========================================================= */

function updateEnemies(
 dt
){

 /*
   DEATHMATCH에서는 enemies 배열이 비어있다.
 */

 if(
  !gameStarted ||
  gameOver ||
  playerDead
 )return;

 if(gameMode==="training")return;
 if(gameMode!=="round")return;

 for(
  const enemy of enemies
 ){

  if(
   enemy.dead ||
   !enemy.root
  )continue;

  const pos=
   enemy.root.position;

  const dx=
   camera.position.x-
   pos.x;

  const dz=
   camera.position.z-
   pos.z;

  const dist=
   Math.hypot(
    dx,
    dz
   );

  if(
   dist>2.3
  ){

   const dirX=
    dx/dist;

   const dirZ=
    dz/dist;

   moveWithCollision(
    pos,
    dirX*
     enemy.speed*
     dt,
    dirZ*
     enemy.speed*
     dt,
    ENEMY_RADIUS
   );

  }else{

   enemy.attackTimer-=
    dt;

   if(
    enemy.attackTimer<=0
   ){

    enemy.attackTimer=
     .8;

    damagePlayer(
     5+
     Math.floor(
      Math.random()*6
     )
    );

   }

  }

  enemy.root.rotation.y=
   Math.atan2(
    dx,
    dz
   );

 }

}

/* =========================================================
   DEATH ANIMATION
========================================================= */

function updateDeaths(
 dt
){

 for(
  const enemy of enemies
 ){

  if(
   !enemy.dead ||
   !enemy.root
  )continue;

  enemy.deathTimer+=
   dt;

  enemy.root.rotation.z=
   Math.min(
    Math.PI/2,
    enemy.deathTimer*5
   );

  enemy.root.position.y=
   Math.max(
    -.3,
    enemy.root.position.y-
     dt*.7
   );

  if(
   enemy.deathTimer>1.2
  ){

   enemy.root.dispose();

   if(gameMode==="training" && enemy.trainingRespawnQueued){
    const p=getTrainingSpawnPoint();
    const idx=enemies.indexOf(enemy);
    if(idx>=0) enemies.splice(idx,1);
    createEnemy(p[0],p[1]);
   }

  }

 }

}

function updateJoystick(
 x,
 y
){

 const rect=
  joystickZone.getBoundingClientRect();

 const centerX=
  rect.left+
  rect.width/2;

 const centerY=
  rect.top+
  rect.height/2;

 let dx=
  x-centerX;

 let dy=
  y-centerY;

 const max=50;

 const length=
  Math.hypot(
   dx,
   dy
  );

 if(
  length>max
 ){

  dx=
   dx/length*
   max;

  dy=
   dy/length*
   max;

 }

 joystickX=
  dx/max;

 joystickY=
  -dy/max;

 joystickKnob.style.transform=
  `translate(${dx}px,${dy}px)`;

}

function resetJoystick(){

 joystickActive=false;

 joystickPointerId=null;

 joystickX=0;

 joystickY=0;

 joystickKnob.style.transform=
  "translate(0,0)";

}

 resetJoystick
);

applySensitivityValue(sensitivity);
sensitivityRange.addEventListener("input",()=>applySensitivityValue(sensitivityRange.value));
gameSensitivityRange.addEventListener("input",()=>applySensitivityValue(gameSensitivityRange.value));

gameSettingsBtn.addEventListener("pointerdown",e=>{
 e.preventDefault(); e.stopPropagation();
 if(!gameStarted)return;
 gameSettingsPanel.style.display=gameSettingsPanel.style.display==="block"?"none":"block";
});
gameSettingsClose.addEventListener("pointerdown",e=>{
 e.preventDefault(); e.stopPropagation();
 gameSettingsPanel.style.display="none";
});

document.querySelectorAll(".weaponBtn").forEach(btn=>{
 btn.addEventListener("click",()=>{
  setWeapon(btn.dataset.weapon);

  if(gameMode==="round" && roundTransition){
   hideWeaponSelect();
   round++;
   startRound();
   updateHUD();
   return;
  }

  hideWeaponSelect();
 });
});

const zoomBtn=document.getElementById("zoomBtn");
zoomBtn.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();toggleZoom();});
const weaponOpenBtn=document.getElementById("weaponOpenBtn");
weaponOpenBtn.addEventListener("pointerdown",e=>{e.preventDefault();e.stopPropagation();if(gameStarted&&!gameOver&&!playerDead)showWeaponSelect();});

canvas.addEventListener("contextmenu",e=>e.preventDefault());
window.addEventListener("mousedown",e=>{if(e.button===2&&gameStarted&&!gameOver&&!playerDead)setZoom(true);});
window.addEventListener("mouseup",e=>{if(e.button===2)setZoom(false);});

/* =========================================================
   START BUTTON
========================================================= */

startBtn.addEventListener(
 "click",
 startMatch
);

/* =========================================================
   RESTART
========================================================= */

restartBtn.addEventListener(
 "click",
 ()=>{

  cleanupMultiplayer();

  round=1;

  kills=0;

  gameOver=false;

  gameStarted=false;

  startScreen.style.display=
   "flex";

  endScreen.style.display=
   "none";

  if(
   gameMode==="deathmatch"
  ){

   showMultiplayerPanel();

  }

 }
);

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
 "resize",
 ()=>{
  engine.resize();
 }
);

/* =========================================================
   CREATE SCENE
========================================================= */

scene=
 createScene();

showMultiplayerPanel();

updateHUD();

/* =========================================================
   MAIN LOOP
========================================================= */

let lastTime=
 performance.now();

engine.runRenderLoop(
 ()=>{

  const now=
   performance.now();

  let dt=
   (now-lastTime)/1000;

  lastTime=
   now;

  dt=
   Math.min(
    dt,
    .05
   );

  if(
   gameStarted &&
   !gameOver
  ){

   updateMovement(dt);

   updateEnemies(dt);

   updateDeaths(dt);

   updateRespawn(dt);

   updateDeathmatch(dt);

   updateNetwork(dt);

   if(firing)
    shoot();

   checkRound();

   updateHUD();

  }

  scene.render();

 }
);

</script>

</body>
</html>
