<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VECTOR WebGL Test</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
}

#info{
    position:fixed;
    top:20px;
    left:20px;
    z-index:10;
    color:white;
    background:#000c;
    padding:15px;
    font-family:Arial,sans-serif;
}
</style>
</head>

<body>

<div id="info">
    WebGL 테스트 중...
</div>

<canvas id="canvas"></canvas>

<script>

const canvas =
    document.getElementById("canvas");

canvas.width =
    window.innerWidth;

canvas.height =
    window.innerHeight;


/* WebGL 가져오기 */

const gl =
    canvas.getContext("webgl", {
        antialias:true
    });


/* WebGL 지원 여부 */

if(!gl){

    document.getElementById("info").innerHTML =
        "❌ WebGL을 사용할 수 없습니다.<br>" +
        "이 브라우저에서는 3D 게임 실행이 어렵습니다.";

}else{

    document.getElementById("info").innerHTML =
        "✅ WebGL 정상 작동<br>" +
        "아래에 색깔 있는 삼각형이 보여야 합니다.";


    /* 버텍스 셰이더 */

    const vertexShaderSource = `
        attribute vec2 position;

        void main(){
            gl_Position =
                vec4(position,0.0,1.0);
        }
    `;


    /* 프래그먼트 셰이더 */

    const fragmentShaderSource = `
        precision mediump float;

        void main(){
            gl_FragColor =
                vec4(1.0,0.15,0.1,1.0);
        }
    `;


    function createShader(
        type,
        source
    ){

        const shader =
            gl.createShader(type);

        gl.shaderSource(
            shader,
            source
        );

        gl.compileShader(shader);

        return shader;
    }


    const vertexShader =
        createShader(
            gl.VERTEX_SHADER,
            vertexShaderSource
        );


    const fragmentShader =
        createShader(
            gl.FRAGMENT_SHADER,
            fragmentShaderSource
        );


    const program =
        gl.createProgram();

    gl.attachShader(
        program,
        vertexShader
    );

    gl.attachShader(
        program,
        fragmentShader
    );

    gl.linkProgram(program);

    gl.useProgram(program);


    /* 삼각형 */

    const vertices =
        new Float32Array([
             0.0,  0.7,
            -0.7, -0.7,
             0.7, -0.7
        ]);


    const buffer =
        gl.createBuffer();

    gl.bindBuffer(
        gl.ARRAY_BUFFER,
        buffer
    );

    gl.bufferData(
        gl.ARRAY_BUFFER,
        vertices,
        gl.STATIC_DRAW
    );


    const position =
        gl.getAttribLocation(
            program,
            "position"
        );


    gl.enableVertexAttribArray(
        position
    );


    gl.vertexAttribPointer(
        position,
        2,
        gl.FLOAT,
        false,
        0,
        0
    );


    /* 화면 초기화 */

    gl.viewport(
        0,
        0,
        canvas.width,
        canvas.height
    );

    gl.clearColor(
        0.05,
        0.08,
        0.12,
        1
    );

    gl.clear(
        gl.COLOR_BUFFER_BIT
    );


    /* 삼각형 그리기 */

    gl.drawArrays(
        gl.TRIANGLES,
        0,
        3
    );

}

</script>

</body>
</html>
