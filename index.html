<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VECTOR FPS</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05080d;
  font-family:Arial,Helvetica,sans-serif;
}

#renderCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

/* =========================
   MENU
========================= */

#menu,
#endScreen{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  color:white;
  background:
    radial-gradient(circle at center,#1d3448 0%,#09121c 48%,#020407 100%);
}

#menu h1{
  margin:0;
  font-size:clamp(55px,13vw,110px);
  letter-spacing:16px;
  font-weight:900;
}

.line{
  width:180px;
  height:3px;
  background:#e8edf2;
  margin:18px 0;
}

.sub{
  color:#8ea0b5;
  letter-spacing:7px;
  font-size:13px;
  margin-bottom:42px;
}

.mainButton{
  border:0;
  border-radius:3px;
  padding:17px 60px;
  background:#e8edf2;
  color:#081019;
  font-size:17px;
  font-weight:900;
}

.mainButton:active{
  transform:scale(.96);
}

.help{
  margin-top:30px;
  color:#8192a5;
  font-size:12px;
  line-height:1.9;
}

/* =========================
   HUD
========================= */

#hud{
  position:fixed;
  inset:0;
  z-index:20;
  display:none;
  pointer-events:none;
  color:#fff;
}

.info{
  position:absolute;
  top:16px;
  min-width:100px;
  padding:9px 14px;
  background:#07111cdd;
  border:1px solid #455568;
}

.info small{
  display:block;
  color:#8091a5;
  font-size:9px;
  letter-spacing:2px;
}

.info strong{
  font-size:22px;
}

#hostile{
  left:16px;
}

#roundBox{
  left:50%;
  transform:translateX(-50%);
  text-align:center;
}

#ammo{
  right:16px;
  text-align:right;
}

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:30px;
  height:30px;
  transform:translate(-50%,-50%);
}

.ch{
  position:absolute;
  background:#fff;
  box-shadow:0 0 4px #000;
}

.ch1{
  width:2px;
  height:9px;
  left:14px;
  top:0;
}

.ch2{
  width:2px;
  height:9px;
  left:14px;
  bottom:0;
}

.ch3{
  width:9px;
  height:2px;
  left:0;
  top:14px;
}

.ch4{
  width:9px;
  height:2px;
  right:0;
  top:14px;
}

#healthBox{
  position:absolute;
  left:18px;
  bottom:20px;
  width:280px;
}

#healthBar{
  height:14px;
  background:#17212c;
  border:1px solid #607083;
}

#healthFill{
  height:100%;
  width:100%;
  background:#e8edf2;
  transition:.15s;
}

#healthText{
  margin-top:5px;
  color:#cbd4dd;
  font-size:13px;
}

#weaponName{
  position:absolute;
  right:18px;
  bottom:20px;
  color:#b8c4d0;
  font-size:12px;
  letter-spacing:3px;
}

#message{
  position:absolute;
  top:34%;
  left:0;
  right:0;
  text-align:center;
  font-size:30px;
  font-weight:900;
  letter-spacing:6px;
  text-shadow:0 2px 10px #000;
  opacity:0;
}

#hitMarker{
  position:absolute;
  left:50%;
  top:50%;
  width:28px;
  height:28px;
  transform:translate(-50%,-50%);
  opacity:0;
}

.hm{
  position:absolute;
  width:2px;
  height:8px;
  background:white;
}

.hm1{
  left:5px;
  top:3px;
  transform:rotate(45deg);
}

.hm2{
  right:5px;
  top:3px;
  transform:rotate(-45deg);
}

.hm3{
  left:5px;
  bottom:3px;
  transform:rotate(-45deg);
}

.hm4{
  right:5px;
  bottom:3px;
  transform:rotate(45deg);
}

/* =========================
   DAMAGE
========================= */

#damage{
  position:fixed;
  inset:0;
  z-index:21;
  pointer-events:none;
  opacity:0;
  background:
    radial-gradient(circle,transparent 35%,#ff142855 100%);
}

/* =========================
   MOBILE
========================= */

#mobile{
  position:fixed;
  inset:0;
  z-index:30;
  display:none;
  pointer-events:none;
}

.mbtn{
  position:absolute;
  width:68px;
  height:68px;
  border-radius:50%;
  border:1px solid #ffffff55;
  background:#101b28aa;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
  pointer-events:auto;
}

#fire{
  right:28px;
  bottom:105px;
  width:82px;
  height:82px;
}

#reload{
  right:125px;
  bottom:34px;
}

#run{
  left:28px;
  bottom:34px;
}

#jump{
  right:28px;
  bottom:200px;
}

#joystick{
  position:absolute;
  left:22px;
  bottom:95px;
  width:135px;
  height:135px;
  border:1px solid #ffffff25;
  background:#ffffff08;
  border-radius:50%;
  pointer-events:auto;
}

#knob{
  position:absolute;
  left:40px;
  top:40px;
  width:55px;
  height:55px;
  border-radius:50%;
  border:1px solid #ffffff55;
  background:#ffffff20;
}

/* =========================
   END
========================= */

#endScreen{
  display:none;
}

#endTitle{
  margin:0;
  font-size:clamp(48px,10vw,90px);
  letter-spacing:10px;
}

#endScore{
  color:#94a5b8;
  margin:15px 0 35px;
  letter-spacing:4px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){
  #mobile{
    display:block;
  }

  #healthBox{
    width:220px;
  }
}
</style>
</head>

<body>

<canvas id="renderCanvas"></canvas>

<!-- MENU -->

<div id="menu">

  <h1>VECTOR</h1>

  <div class="line"></div>

  <div class="sub">
    TACTICAL FPS
  </div>

  <button id="start" class="mainButton">
    START GAME
  </button>

  <div class="help">
    PC : WASD / SHIFT / SPACE / R / MOUSE<br>
    GALAXY TAB : 왼쪽 조이스틱 / 오른쪽 드래그 / FIRE
  </div>

</div>


<!-- HUD -->

<div id="hud">

  <div id="hostile" class="info">
    <small>HOSTILES</small>
    <strong id="enemyCount">0</strong>
  </div>

  <div id="roundBox" class="info">
    <small>ROUND</small>
    <strong id="round">1</strong>
  </div>

  <div id="ammo" class="info">
    <small>AMMO</small>
    <strong>
      <span id="mag">12</span>/<span id="reserve">60</span>
    </strong>
  </div>

  <div id="crosshair">
    <div class="ch ch1"></div>
    <div class="ch ch2"></div>
    <div class="ch ch3"></div>
    <div class="ch ch4"></div>
  </div>

  <div id="hitMarker">
    <div class="hm hm1"></div>
    <div class="hm hm2"></div>
    <div class="hm hm3"></div>
    <div class="hm hm4"></div>
  </div>

  <div id="healthBox">
    <div id="healthBar">
      <div id="healthFill"></div>
    </div>
    <div id="healthText">100 HP</div>
  </div>

  <div id="weaponName">
    VECTOR RIFLE
  </div>

  <div id="message"></div>

</div>

<div id="damage"></div>


<!-- MOBILE -->

<div id="mobile">

  <div id="joystick">
    <div id="knob"></div>
  </div>

  <div id="fire" class="mbtn">
    FIRE
  </div>

  <div id="reload" class="mbtn">
    R
  </div>

  <div id="run" class="mbtn">
    RUN
  </div>

  <div id="jump" class="mbtn">
    JUMP
  </div>

</div>


<!-- END -->

<div id="endScreen">

  <h1 id="endTitle">
    ELIMINATED
  </h1>

  <div id="endScore">
    0 KILLS
  </div>

  <button id="restart" class="mainButton">
    RESTART
  </button>

</div>


<script src="https://cdn.babylonjs.com/babylon.js"></script>

<script>

/* =========================================================
   VECTOR FPS
   BABYLON.JS
========================================================= */

const canvas =
  document.getElementById("renderCanvas");

const engine =
  new BABYLON.Engine(
    canvas,
    true,
    {
      antialias:true,
      stencil:true
    }
  );

const scene =
  new BABYLON.Scene(engine);

scene.clearColor =
  new BABYLON.Color4(
    .025,
    .045,
    .07,
    1
  );


/* =========================================================
   CAMERA
========================================================= */

const camera =
  new BABYLON.UniversalCamera(
    "Player",
    new BABYLON.Vector3(
      0,
      1.7,
      28
    ),
    scene
  );

camera.minZ=.05;
camera.fov=1.12;

camera.applyGravity=true;
camera.checkCollisions=true;

camera.ellipsoid =
  new BABYLON.Vector3(
    .42,
    .85,
    .42
  );

scene.activeCamera=camera;


/* =========================================================
   WORLD
========================================================= */

scene.gravity =
  new BABYLON.Vector3(
    0,
    -9.81,
    0
  );

scene.collisionsEnabled=true;


/* =========================================================
   LIGHT
========================================================= */

const light =
  new BABYLON.HemisphericLight(
    "ambient",
    new BABYLON.Vector3(
      0,
      1,
      0
    ),
    scene
  );

light.intensity=1.1;

const sun =
  new BABYLON.DirectionalLight(
    "sun",
    new BABYLON.Vector3(
      -.5,
      -1,
      .4
    ),
    scene
  );

sun.position =
  new BABYLON.Vector3(
    20,
    40,
    20
  );

sun.intensity=1.2;


/* =========================================================
   MATERIAL
========================================================= */

function mat(name,hex){

  const m =
    new BABYLON.StandardMaterial(
      name,
      scene
    );

  m.diffuseColor =
    BABYLON.Color3.FromHexString(hex);

  m.specularColor =
    new BABYLON.Color3(.15,.15,.15);

  return m;
}

const floorMat=mat(
  "Floor",
  "#28333E"
);

const wallMat=mat(
  "Wall",
  "#536271"
);

const coverMat=mat(
  "Cover",
  "#697887"
);

const enemyMat=mat(
  "Enemy",
  "#C43D4D"
);

const headMat=mat(
  "Head",
  "#E5A28E"
);

const gunMat=mat(
  "Gun",
  "#11171D"
);

const muzzleMat=mat(
  "Muzzle",
  "#FFD45C"
);

const bulletMat=mat(
  "Bullet",
  "#FFD36A"
);


/* =========================================================
   FLOOR
========================================================= */

const floor =
  BABYLON.MeshBuilder.CreateGround(
    "Ground",
    {
      width:100,
      height:100
    },
    scene
  );

floor.material=floorMat;
floor.checkCollisions=true;


/* =========================================================
   GRID
========================================================= */

for(
  let i=-45;
  i<=45;
  i+=3
){

  const a =
    BABYLON.MeshBuilder.CreateLines(
      "grid",
      {
        points:[
          new BABYLON.Vector3(
            i,.015,-45
          ),
          new BABYLON.Vector3(
            i,.015,45
          )
        ]
      },
      scene
    );

  a.color =
    new BABYLON.Color3(
      .22,.27,.32
    );


  const b =
    BABYLON.MeshBuilder.CreateLines(
      "grid",
      {
        points:[
          new BABYLON.Vector3(
            -45,.016,i
          ),
          new BABYLON.Vector3(
            45,.016,i
          )
        ]
      },
      scene
    );

  b.color =
    new BABYLON.Color3(
      .22,.27,.32
    );
}


/* =========================================================
   BOX
========================================================= */

const obstacles=[];

function box(
  name,
  w,h,d,
  x,y,z,
  material
){

  const b =
    BABYLON.MeshBuilder.CreateBox(
      name,
      {
        width:w,
        height:h,
        depth:d
      },
      scene
    );

  b.position =
    new BABYLON.Vector3(
      x,y,z
    );

  b.material=material;

  b.checkCollisions=true;

  obstacles.push(b);

  return b;
}


/* =========================================================
   MAP
========================================================= */

box(
  "North",
  100,8,2,
  0,4,-48,
  wallMat
);

box(
  "South",
  100,8,2,
  0,4,48,
  wallMat
);

box(
  "West",
  2,8,100,
  -48,4,0,
  wallMat
);

box(
  "East",
  2,8,100,
  48,4,0,
  wallMat
);


/* central */

box(
  "Center1",
  17,3,3,
  0,1.5,0,
  coverMat
);

box(
  "Center2",
  3,3,17,
  0,1.5,0,
  coverMat
);


/* covers */

box(
  "Cover1",
  10,3,3,
  -23,1.5,-13,
  coverMat
);

box(
  "Cover2",
  10,3,3,
  23,1.5,-13,
  coverMat
);

box(
  "Cover3",
  10,3,3,
  -23,1.5,13,
  coverMat
);

box(
  "Cover4",
  10,3,3,
  23,1.5,13,
  coverMat
);

box(
  "Cover5",
  3,3,10,
  -11,1.5,27,
  coverMat
);

box(
  "Cover6",
  3,3,10,
  11,1.5,27,
  coverMat
);


/* =========================================================
   GUN
========================================================= */

const gun =
  new BABYLON.TransformNode(
    "Gun",
    scene
  );

gun.parent=camera;

gun.position =
  new BABYLON.Vector3(
    .32,
    -.28,
    .72
  );


const gunBody =
  BABYLON.MeshBuilder.CreateBox(
    "GunBody",
    {
      width:.19,
      height:.19,
      depth:.7
    },
    scene
  );

gunBody.parent=gun;
gunBody.material=gunMat;


const barrel =
  BABYLON.MeshBuilder.CreateCylinder(
    "Barrel",
    {
      diameter:.075,
      height:.5,
      tessellation:12
    },
    scene
  );

barrel.parent=gun;

barrel.rotation.x=
  Math.PI/2;

barrel.position.z=.52;

barrel.material=gunMat;


const grip =
  BABYLON.MeshBuilder.CreateBox(
    "Grip",
    {
      width:.13,
      height:.3,
      depth:.16
    },
    scene
  );

grip.parent=gun;

grip.position =
  new BABYLON.Vector3(
    0,
    -.2,
    .1
  );

grip.rotation.x=-.2;

grip.material=gunMat;


/* =========================================================
   MUZZLE FLASH
========================================================= */

const muzzle =
  BABYLON.MeshBuilder.CreateSphere(
    "MuzzleFlash",
    {
      diameter:.22,
      segments:8
    },
    scene
  );

muzzle.parent=gun;

muzzle.position.z=.78;

muzzle.material=muzzleMat;

muzzle.isVisible=false;


/* =========================================================
   GAME STATE
========================================================= */

let started=false;
let ended=false;

let hp=100;

let magazine=12;
let reserve=60;

const MAG_SIZE=12;

let kills=0;
let round=1;

let reloadLock=false;

let lastShot=0;

const FIRE_DELAY=145;

const enemies=[];


/* =========================================================
   ENEMY POSITIONS
========================================================= */

const spawnPoints=[
  [-22,-25],
  [22,-25],
  [-28,0],
  [28,0],
  [-20,23],
  [20,23],
  [0,-32],
  [0,32]
];


/* =========================================================
   CREATE ENEMY
========================================================= */

function createEnemy(x,z){

  const root =
    new BABYLON.TransformNode(
      "EnemyRoot",
      scene
    );

  root.position =
    new BABYLON.Vector3(
      x,
      0,
      z
    );

  root.metadata={
    alive:true,
    hp:100,
    speed:
      1.3+
      Math.random()*.8,
    cooldown:
      .5+
      Math.random()*1.5
  };


  /* body */

  const body =
    BABYLON.MeshBuilder.CreateBox(
      "EnemyBody",
      {
        width:.85,
        height:1.6,
        depth:.55
      },
      scene
    );

  body.parent=root;

  body.position.y=1;

  body.material=enemyMat;

  body.metadata={
    enemy:root,
    type:"body"
  };


  /* head */

  const head =
    BABYLON.MeshBuilder.CreateSphere(
      "EnemyHead",
      {
        diameter:.64,
        segments:16
      },
      scene
    );

  head.parent=root;

  head.position.y=2.15;

  head.material=headMat;

  head.metadata={
    enemy:root,
    type:"head"
  };


  /* weapon */

  const weapon =
    BABYLON.MeshBuilder.CreateBox(
      "EnemyGun",
      {
        width:.11,
        height:.11,
        depth:.65
      },
      scene
    );

  weapon.parent=root;

  weapon.position =
    new BABYLON.Vector3(
      .45,
      1.05,
      .25
    );

  weapon.material=gunMat;


  enemies.push(root);
}


/* =========================================================
   START ROUND
========================================================= */

function startRound(){

  enemies.forEach(
    e=>e.dispose()
  );

  enemies.length=0;


  const amount =
    Math.min(
      3+round,
      spawnPoints.length
    );


  for(
    let i=0;
    i<amount;
    i++
  ){

    createEnemy(
      spawnPoints[i][0],
      spawnPoints[i][1]
    );

  }


  updateHUD();

  showMessage(
    "ROUND "+round
  );

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  const alive =
    enemies.filter(
      e=>
        e.metadata &&
        e.metadata.alive
    ).length;


  document.getElementById(
    "enemyCount"
  ).textContent=alive;


  document.getElementById(
    "round"
  ).textContent=round;


  document.getElementById(
    "mag"
  ).textContent=magazine;


  document.getElementById(
    "reserve"
  ).textContent=reserve;


  document.getElementById(
    "healthFill"
  ).style.width=
    hp+"%";


  document.getElementById(
    "healthText"
  ).textContent=
    Math.ceil(hp)+" HP";

}


/* =========================================================
   MESSAGE
========================================================= */

let msgTimer;

function showMessage(text){

  const el=
    document.getElementById(
      "message"
    );

  el.textContent=text;

  el.style.opacity=1;

  clearTimeout(msgTimer);

  msgTimer=
    setTimeout(
      ()=>{
        el.style.opacity=0;
      },
      850
    );
}


/* =========================================================
   HIT MARKER
========================================================= */

let hitTimer;

function hitMarker(){

  const el=
    document.getElementById(
      "hitMarker"
    );

  el.style.opacity=1;

  clearTimeout(hitTimer);

  hitTimer=
    setTimeout(
      ()=>{
        el.style.opacity=0;
      },
      90
    );
}


/* =========================================================
   PLAYER DAMAGE
========================================================= */

function damagePlayer(amount){

  if(
    !started ||
    ended
  )
    return;


  hp-=amount;

  hp=Math.max(
    0,
    hp
  );


  const d=
    document.getElementById(
      "damage"
    );

  d.style.opacity=1;

  setTimeout(
    ()=>{
      d.style.opacity=0;
    },
    120
  );


  updateHUD();


  if(hp<=0){

    finish(false);

  }

}


/* =========================================================
   SHOOT
========================================================= */

function shoot(){

  if(
    !started ||
    ended ||
    reloadLock
  )
    return;


  const now=
    performance.now();


  if(
    now-lastShot<
    FIRE_DELAY
  )
    return;


  if(magazine<=0){

    reload();

    return;

  }


  lastShot=now;

  magazine--;

  updateHUD();


  /* recoil */

  camera.rotation.x+=.018;

  gun.position.z+=.06;

  muzzle.isVisible=true;


  setTimeout(
    ()=>{
      muzzle.isVisible=false;
      gun.position.z-=.06;
    },
    65
  );


  /* ray */

  const ray=
    scene.createPickingRay(
      engine.getRenderWidth()/2,
      engine.getRenderHeight()/2,
      BABYLON.Matrix.Identity(),
      camera
    );


  const result=
    scene.pickWithRay(
      ray,
      mesh=>{
        return !!(
          mesh.metadata &&
          mesh.metadata.enemy
        );
      }
    );


  if(
    result &&
    result.hit &&
    result.pickedMesh
  ){

    const mesh=
      result.pickedMesh;

    const enemy=
      mesh.metadata.enemy;


    if(
      !enemy ||
      !enemy.metadata.alive
    )
      return;


    const type=
      mesh.metadata.type;


    const damage=
      type==="head"
      ? 100
      : 34;


    enemy.metadata.hp-=damage;

    hitMarker();


    if(type==="head"){

      showMessage(
        "HEADSHOT"
      );

    }


    if(
      enemy.metadata.hp<=0
    ){

      killEnemy(enemy);

    }

  }

}


/* =========================================================
   KILL
========================================================= */

function killEnemy(enemy){

  if(
    !enemy.metadata.alive
  )
    return;


  enemy.metadata.alive=false;

  kills++;


  showMessage(
    "ELIMINATED"
  );


  let t=0;


  const animation=
    setInterval(
      ()=>{

        t+=.08;

        enemy.rotation.x=
          -Math.min(
            t,
            Math.PI/2
          );

        enemy.position.y=
          Math.max(
            0,
            enemy.position.y-.025
          );


        if(t>=Math.PI/2){

          clearInterval(
            animation
          );

          enemy.setEnabled(false);

          updateHUD();

          checkRound();

        }

      },
      30
    );


  updateHUD();

}


/* =========================================================
   ROUND CHECK
========================================================= */

function checkRound(){

  const alive=
    enemies.filter(
      e=>
        e.metadata.alive
    ).length;


  if(alive!==0)
    return;


  setTimeout(
    ()=>{

      if(
        ended ||
        !started
      )
        return;


      round++;

      magazine=MAG_SIZE;

      reserve=
        Math.min(
          120,
          reserve+24
        );

      hp=
        Math.min(
          100,
          hp+25
        );


      startRound();

    },
    1200
  );

}


/* =========================================================
   RELOAD
========================================================= */

function reload(){

  if(
    reloadLock ||
    magazine>=MAG_SIZE ||
    reserve<=0
  )
    return;


  reloadLock=true;

  showMessage(
    "RELOADING"
  );


  setTimeout(
    ()=>{

      const need=
        MAG_SIZE-magazine;

      const amount=
        Math.min(
          need,
          reserve
        );

      magazine+=amount;

      reserve-=amount;

      reloadLock=false;

      updateHUD();

    },
    850
  );

}


/* =========================================================
   ENEMY LINE OF SIGHT
========================================================= */

function canSeePlayer(enemy){

  const origin=
    enemy.position.clone();

  origin.y=1.6;


  const target=
    camera.position.clone();


  const direction=
    target.subtract(origin);


  const length=
    direction.length();


  direction.normalize();


  const ray=
    new BABYLON.Ray(
      origin,
      direction,
      length
    );


  const hit=
    scene.pickWithRay(
      ray,
      mesh=>{
        return (
          mesh!==enemy &&
          mesh!==floor &&
          mesh.metadata===undefined
        );
      }
    );


  if(
    !hit ||
    !hit.hit
  )
    return true;


  return (
    hit.pickedMesh===undefined
  );

}


/* =========================================================
   ENEMY AI
========================================================= */

function updateEnemies(){

  if(
    !started ||
    ended
  )
    return;


  const dt=
    engine.getDeltaTime()/1000;


  enemies.forEach(
    enemy=>{

      if(
        !enemy.metadata.alive
      )
        return;


      const dx=
        camera.position.x-
        enemy.position.x;

      const dz=
        camera.position.z-
        enemy.position.z;


      const distance=
        Math.sqrt(
          dx*dx+
          dz*dz
        );


      /* face player */

      enemy.rotation.y=
        Math.atan2(
          dx,
          dz
        );


      /* move */

      if(
        distance>8
      ){

        const len=
          Math.sqrt(
            dx*dx+
            dz*dz
          );


        if(len>.1){

          enemy.position.x+=
            dx/len*
            enemy.metadata.speed*
            dt;

          enemy.position.z+=
            dz/len*
            enemy.metadata.speed*
            dt;

        }

      }


      /* attack */

      enemy.metadata.cooldown-=dt;


      if(
        distance<30 &&
        enemy.metadata.cooldown<=0
      ){

        enemy.metadata.cooldown=
          .9+
          Math.random()*1.4;


        const hitChance=
          Math.max(
            .18,
            1-distance/38
          );


        if(
          Math.random()<hitChance
        ){

          damagePlayer(
            4+
            Math.random()*6
          );

        }

      }

    }
  );

}


/* =========================================================
   INPUT
========================================================= */

const keys={};

window.addEventListener(
  "keydown",
  e=>{

    keys[e.code]=true;

    if(
      e.code==="KeyR"
    )
      reload();

    if(
      e.code==="Space"
    ){

      if(
        camera.position.y<=1.8
      ){

        camera.cameraDirection.y=
          .22;

      }

    }

  }
);

window.addEventListener(
  "keyup",
  e=>{
    keys[e.code]=false;
  }
);


/* =========================================================
   MOVEMENT
========================================================= */

let joyX=0;
let joyY=0;
let sprinting=false;

function updateMovement(){

  if(
    !started ||
    ended
  )
    return;


  const dt=
    engine.getDeltaTime()/1000;


  let forward=0;
  let side=0;


  if(keys.KeyW)
    forward+=1;

  if(keys.KeyS)
    forward-=1;

  if(keys.KeyD)
    side+=1;

  if(keys.KeyA)
    side-=1;


  forward+=-joyY;
  side+=joyX;


  const len=
    Math.sqrt(
      forward*forward+
      side*side
    );


  if(len>1){

    forward/=len;
    side/=len;

  }


  let speed=
    sprinting ||
    keys.ShiftLeft
    ? 8
    : 5;


  const yaw=
    camera.rotation.y;


  const x=
    side*Math.cos(yaw)+
    forward*Math.sin(yaw);


  const z=
    forward*Math.cos(yaw)-
    side*Math.sin(yaw);


  camera.cameraDirection.x=
    x*speed*dt;

  camera.cameraDirection.z=
    z*speed*dt;

}


/* =========================================================
   MOUSE
========================================================= */

canvas.addEventListener(
  "click",
  ()=>{

    if(
      started &&
      !ended &&
      !isTouch()
    ){

      canvas.requestPointerLock?.();

    }

  }
);


document.addEventListener(
  "mousemove",
  e=>{

    if(
      !started ||
      ended ||
      document.pointerLockElement!==canvas
    )
      return;


    camera.rotation.y-=
      e.movementX*.0025;

    camera.rotation.x-=
      e.movementY*.0025;


    camera.rotation.x=
      Math.max(
        -1.45,
        Math.min(
          1.45,
          camera.rotation.x
        )
      );

  }
);


window.addEventListener(
  "mousedown",
  e=>{

    if(
      e.button===0 &&
      started
    )
      shoot();

  }
);


/* =========================================================
   MOBILE LOOK
========================================================= */

let lookId=null;
let lookX=0;
let lookY=0;


canvas.addEventListener(
  "touchstart",
  e=>{

    if(!started)
      return;


    for(
      const t of e.changedTouches
    ){

      if(
        t.clientX>
        innerWidth*.35
      ){

        lookId=t.identifier;

        lookX=t.clientX;
        lookY=t.clientY;

        break;

      }

    }

  },
  {passive:false}
);


canvas.addEventListener(
  "touchmove",
  e=>{

    if(lookId===null)
      return;


    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===lookId
      ){

        const dx=
          t.clientX-lookX;

        const dy=
          t.clientY-lookY;


        camera.rotation.y-=
          dx*.004;

        camera.rotation.x-=
          dy*.004;


        camera.rotation.x=
          Math.max(
            -1.45,
            Math.min(
              1.45,
              camera.rotation.x
            )
          );


        lookX=t.clientX;
        lookY=t.clientY;

      }

    }

  },
  {passive:false}
);


canvas.addEventListener(
  "touchend",
  e=>{

    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===lookId
      )
        lookId=null;

    }

  }
);


/* =========================================================
   JOYSTICK
========================================================= */

const joystick=
  document.getElementById(
    "joystick"
  );

const knob=
  document.getElementById(
    "knob"
  );

let joyId=null;


joystick.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    joyId=
      e.changedTouches[0].identifier;

  },
  {passive:false}
);


joystick.addEventListener(
  "touchmove",
  e=>{

    e.preventDefault();


    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier!==joyId
      )
        continue;


      const r=
        joystick.getBoundingClientRect();


      let dx=
        t.clientX-
        (r.left+r.width/2);

      let dy=
        t.clientY-
        (r.top+r.height/2);


      const radius=45;

      const dist=
        Math.sqrt(
          dx*dx+
          dy*dy
        );


      if(dist>radius){

        dx=
          dx/dist*radius;

        dy=
          dy/dist*radius;

      }


      joyX=dx/radius;
      joyY=dy/radius;


      knob.style.transform=
        `translate(${dx}px,${dy}px)`;

    }

  },
  {passive:false}
);


joystick.addEventListener(
  "touchend",
  ()=>{

    joyX=0;
    joyY=0;
    joyId=null;

    knob.style.transform=
      "translate(0,0)";

  }
);


/* =========================================================
   MOBILE BUTTONS
========================================================= */

const fire=
  document.getElementById(
    "fire"
  );

fire.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    shoot();

  },
  {passive:false}
);


document
  .getElementById("reload")
  .addEventListener(
    "touchstart",
    e=>{

      e.preventDefault();

      reload();

    },
    {passive:false}
  );


const run=
  document.getElementById(
    "run"
  );

run.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    sprinting=true;

  },
  {passive:false}
);

run.addEventListener(
  "touchend",
  e=>{

    e.preventDefault();

    sprinting=false;

  },
  {passive:false}
);


document
  .getElementById("jump")
  .addEventListener(
    "touchstart",
    e=>{

      e.preventDefault();

      camera.cameraDirection.y=
        .22;

    },
    {passive:false}
  );


/* =========================================================
   TOUCH DETECTION
========================================================= */

function isTouch(){

  return (
    navigator.maxTouchPoints>0 ||
    "ontouchstart" in window
  );

}


/* =========================================================
   START
========================================================= */

function startGame(){

  started=true;
  ended=false;

  hp=100;

  magazine=12;
  reserve=60;

  kills=0;
  round=1;

  reloadLock=false;


  camera.position=
    new BABYLON.Vector3(
      0,
      1.7,
      28
    );

  camera.rotation=
    new BABYLON.Vector3(
      0,
      0,
      0
    );


  document.getElementById(
    "menu"
  ).style.display="none";


  document.getElementById(
    "endScreen"
  ).style.display="none";


  document.getElementById(
    "hud"
  ).style.display="block";


  startRound();

  updateHUD();


  if(!isTouch()){

    setTimeout(
      ()=>{
        canvas.requestPointerLock?.();
      },
      150
    );

  }

}


/* =========================================================
   END
========================================================= */

function finish(victory){

  ended=true;
  started=false;

  document.exitPointerLock?.();


  document.getElementById(
    "endTitle"
  ).textContent=
    victory
    ? "VICTORY"
    : "ELIMINATED";


  document.getElementById(
    "endScore"
  ).textContent=
    "ROUND "+
    round+
    "  /  "+
    kills+
    " KILLS";


  document.getElementById(
    "endScreen"
  ).style.display=
    "flex";

}


/* =========================================================
   BUTTONS
========================================================= */

document
  .getElementById("start")
  .addEventListener(
    "click",
    startGame
  );

document
  .getElementById("restart")
  .addEventListener(
    "click",
    startGame
  );


/* =========================================================
   LOOP
========================================================= */

engine.runRenderLoop(
  ()=>{

    if(
      started &&
      !ended
    ){

      updateMovement();

      updateEnemies();

    }

    scene.render();

  }
);


window.addEventListener(
  "resize",
  ()=>{
    engine.resize();
  }
);


updateHUD();

</script>
