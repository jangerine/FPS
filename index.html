<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>VECTOR FPS</title>

<script src="https://cdn.babylonjs.com/babylon.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
  touch-action:none;
}

#game{
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:100;
  color:white;
}

/* =========================
   TOP HUD
========================= */

#topHud{
  position:absolute;
  top:18px;
  left:18px;
  right:18px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  font-weight:bold;
  text-shadow:
    0 2px 4px #000,
    0 0 8px #000;
}

#round{
  font-size:22px;
}

#enemyCount{
  font-size:18px;
}

#ammo{
  position:absolute;
  right:20px;
  bottom:22px;
  font-size:28px;
}

#hp{
  position:absolute;
  left:20px;
  bottom:22px;
  font-size:25px;
}

/* =========================
   CROSSHAIR
========================= */

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:24px;
  height:24px;
  transform:translate(-50%,-50%);
}

#crosshair::before,
#crosshair::after{
  content:"";
  position:absolute;
  background:white;
  box-shadow:0 0 4px #000;
}

#crosshair::before{
  width:2px;
  height:24px;
  left:11px;
  top:0;
}

#crosshair::after{
  width:24px;
  height:2px;
  left:0;
  top:11px;
}

#hitMarker{
  position:absolute;
  left:50%;
  top:50%;
  width:25px;
  height:25px;
  transform:translate(-50%,-50%);
  opacity:0;
}

#hitMarker::before,
#hitMarker::after{
  content:"";
  position:absolute;
  width:25px;
  height:2px;
  top:11px;
  left:0;
  background:#fff;
}

#hitMarker::before{
  transform:rotate(45deg);
}

#hitMarker::after{
  transform:rotate(-45deg);
}

/* =========================
   MENU
========================= */

#menu{
  position:fixed;
  inset:0;
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:
    radial-gradient(circle at center,#182535 0%,#05080d 65%,#000 100%);
  color:white;
}

#menu h1{
  margin:0 0 10px;
  font-size:52px;
  letter-spacing:8px;
}

#menu p{
  margin:0 0 30px;
  color:#aab7c4;
}

#startButton{
  border:2px solid #fff;
  background:#111c28;
  color:#fff;
  padding:16px 45px;
  font-size:20px;
  font-weight:bold;
  border-radius:8px;
}

#startButton:active{
  transform:scale(.96);
}

/* =========================
   END SCREEN
========================= */

#endScreen{
  position:fixed;
  inset:0;
  z-index:450;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:rgba(0,0,0,.82);
  color:white;
}

#endTitle{
  font-size:52px;
  font-weight:bold;
  margin-bottom:25px;
}

#restartButton{
  padding:15px 40px;
  font-size:20px;
  font-weight:bold;
  border:0;
  border-radius:8px;
}

/* =========================
   MOBILE CONTROLS
========================= */

#mobile{
  position:fixed;
  inset:0;
  z-index:200;
  pointer-events:none;
  display:none;
}

#joystick{
  position:absolute;
  left:25px;
  bottom:25px;
  width:135px;
  height:135px;
  border-radius:50%;
  background:rgba(255,255,255,.14);
  border:2px solid rgba(255,255,255,.35);
  pointer-events:auto;
  touch-action:none;
}

#joystickKnob{
  position:absolute;
  width:55px;
  height:55px;
  left:40px;
  top:40px;
  border-radius:50%;
  background:rgba(255,255,255,.5);
  border:2px solid rgba(255,255,255,.8);
}

.mobileBtn{
  position:absolute;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.7);
  background:rgba(20,25,30,.65);
  color:#fff;
  font-weight:bold;
  font-size:14px;
  pointer-events:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:none;
}

#fireBtn{
  right:25px;
  bottom:105px;
  width:82px;
  height:82px;
  background:rgba(180,40,40,.6);
}

#fireBtn:active{
  background:rgba(230,55,55,.8);
  transform:scale(.96);
}

#reloadBtn{
  right:125px;
  bottom:30px;
  width:65px;
  height:65px;
}

#runBtn{
  left:185px;
  bottom:30px;
  width:65px;
  height:65px;
}

#jumpBtn{
  right:25px;
  bottom:205px;
  width:65px;
  height:65px;
}

/* =========================
   MOBILE DEVICE
========================= */

@media (pointer:coarse){
  #mobile{
    display:block;
  }

  #menu h1{
    font-size:38px;
    letter-spacing:5px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div id="topHud">
    <div id="round">ROUND 1</div>
    <div id="enemyCount">ENEMIES: 0</div>
  </div>

  <div id="crosshair"></div>
  <div id="hitMarker"></div>

  <div id="hp">HP 100</div>
  <div id="ammo">12 / 60</div>

</div>

<!-- =========================
     START MENU
========================= -->

<div id="menu">

  <h1>VECTOR FPS</h1>

  <p>
    WASD / JOYSTICK · AIM · FIRE · RELOAD
  </p>

  <button id="startButton">
    START GAME
  </button>

</div>

<!-- =========================
     END SCREEN
========================= -->

<div id="endScreen">

  <div id="endTitle">YOU DIED</div>

  <button id="restartButton">
    RESTART
  </button>

</div>

<!-- =========================
     MOBILE
========================= -->

<div id="mobile">

  <div id="joystick">
    <div id="joystickKnob"></div>
  </div>

  <div id="fireBtn" class="mobileBtn">
    FIRE
  </div>

  <div id="reloadBtn" class="mobileBtn">
    R
  </div>

  <div id="runBtn" class="mobileBtn">
    RUN
  </div>

  <div id="jumpBtn" class="mobileBtn">
    JUMP
  </div>

</div>

<script>

/* =========================================================
   BASIC
========================================================= */

const canvas = document.getElementById("game");

const engine = new BABYLON.Engine(
  canvas,
  true,
  {
    preserveDrawingBuffer:true,
    stencil:true
  }
);

const scene = new BABYLON.Scene(engine);

scene.clearColor =
  new BABYLON.Color4(.025,.035,.05,1);


/* =========================================================
   CAMERA
========================================================= */

const camera =
  new BABYLON.UniversalCamera(
    "camera",
    new BABYLON.Vector3(0,1.7,28),
    scene
  );

camera.minZ=.1;

camera.speed=0;

camera.angularSensibility=1000;

camera.applyGravity=false;

camera.checkCollisions=true;

camera.ellipsoid=
  new BABYLON.Vector3(.45,.8,.45);

scene.activeCamera=camera;


/* =========================================================
   LIGHT
========================================================= */

const light =
  new BABYLON.HemisphericLight(
    "light",
    new BABYLON.Vector3(0,1,0),
    scene
  );

light.intensity=1.1;


/* =========================================================
   MATERIALS
========================================================= */

function mat(name,color){

  const m =
    new BABYLON.StandardMaterial(name,scene);

  m.diffuseColor =
    new BABYLON.Color3(
      color[0],
      color[1],
      color[2]
    );

  return m;
}

const floorMat=mat(
  "floor",
  [.08,.09,.11]
);

const wallMat=mat(
  "wall",
  [.16,.18,.21]
);

const coverMat=mat(
  "cover",
  [.25,.27,.30]
);

const enemyMat=mat(
  "enemy",
  [.8,.12,.12]
);

const enemyHeadMat=mat(
  "enemyHead",
  [.95,.35,.35]
);


/* =========================================================
   ARENA
========================================================= */

const floor=
  BABYLON.MeshBuilder.CreateGround(
    "floor",
    {
      width:70,
      height:70
    },
    scene
  );

floor.material=floorMat;


/* walls */

function createWall(
  x,
  y,
  z,
  sx,
  sy,
  sz
){

  const w=
    BABYLON.MeshBuilder.CreateBox(
      "wall",
      {
        width:sx,
        height:sy,
        depth:sz
      },
      scene
    );

  w.position.set(x,y,z);

  w.material=wallMat;

  w.checkCollisions=true;

  return w;
}

createWall(0,3.5,-35,70,7,1);

createWall(0,3.5,35,70,7,1);

createWall(-35,3.5,0,1,7,70);

createWall(35,3.5,0,1,7,70);


/* =========================================================
   COVER
========================================================= */

function createCover(x,z){

  const c=
    BABYLON.MeshBuilder.CreateBox(
      "cover",
      {
        width:4,
        height:2.2,
        depth:3
      },
      scene
    );

  c.position.set(x,1.1,z);

  c.material=coverMat;

  c.checkCollisions=true;

  return c;
}

createCover(-12,-8);
createCover(10,-5);
createCover(-7,10);
createCover(13,13);
createCover(-18,18);
createCover(20,-20);


/* =========================================================
   GAME VARIABLES
========================================================= */

let started=false;
let ended=false;

let round=1;

let hp=100;

let ammo=12;
let reserve=60;

const MAG_SIZE=12;

let enemies=[];


/* =========================================================
   MOVEMENT
========================================================= */

const WALK_SPEED=1.6;
const RUN_SPEED=2.7;

const GROUND_Y=1.7;

const JUMP_POWER=5.5;
const GRAVITY=14;

let jumpVelocity=0;

let running=false;


/* =========================================================
   WEAPON
========================================================= */

const FIRE_DELAY=145;

let lastShot=0;

let firing=false;

let reloading=false;


/* =========================================================
   RECOIL SYSTEM
   ★ 새로 추가
========================================================= */

/*
  recoilPitch

  현재 화면에 적용되고 있는 반동값.
  Babylon 카메라 rotation.x에 더해진다.
*/
let recoilPitch=0;

/*
  recoilTarget

  연사하면서 누적되는 반동 목표값.
*/
let recoilTarget=0;

/*
  recoilYaw

  아주 약한 좌우 반동.
*/
let recoilYaw=0;

/*
  반동 세기

  값이 클수록 한 발마다 화면이 더 위로 올라간다.
*/
const RECOIL_PER_SHOT=.035;

/*
  최대 누적 반동.
*/
const MAX_RECOIL=.24;

/*
  반동이 돌아오는 속도.
*/
const RECOIL_RETURN_SPEED=8;

/*
  좌우 반동.
*/
const RECOIL_SIDE=.008;


/* =========================================================
   MOBILE INPUT
========================================================= */

let joyX=0;
let joyY=0;

let joystickTouchId=null;

let lookTouchId=null;

let lastLookX=0;
let lastLookY=0;


/* =========================================================
   INPUT
========================================================= */

const keys={};

window.addEventListener(
  "keydown",
  e=>{

    keys[e.code]=true;

    if(e.code==="Space"){
      jump();
    }

    if(e.code==="KeyR"){
      reload();
    }

  }
);

window.addEventListener(
  "keyup",
  e=>{
    keys[e.code]=false;
  }
);


/* =========================================================
   PC MOUSE LOOK
========================================================= */

canvas.addEventListener(
  "click",
  ()=>{

    if(started){
      canvas.requestPointerLock();
    }

  }
);

document.addEventListener(
  "mousemove",
  e=>{

    if(
      document.pointerLockElement!==canvas
    ) return;

    /*
      반동은 camera.rotation.x에 직접
      영구적으로 더하지 않고 recoilPitch를
      별도로 관리한다.

      따라서 마우스 조준과 반동이 서로
      충돌하지 않는다.
    */

    camera.rotation.y +=
      e.movementX*.0025;

    camera.rotation.x +=
      e.movementY*.0025;

    camera.rotation.x =
      Math.max(
        -1.45,
        Math.min(
          1.45,
          camera.rotation.x
        )
      );

  }
);


/* =========================================================
   PC FIRE
   ★ 마우스를 누르고 있는 동안 연사
========================================================= */

document.addEventListener(
  "mousedown",
  e=>{

    if(e.button!==0) return;

    if(!started || ended) return;

    firing=true;

    /*
      첫 발은 즉시 발사
    */
    shoot();

  }
);

document.addEventListener(
  "mouseup",
  e=>{

    if(e.button!==0) return;

    firing=false;

  }
);


/* =========================================================
   JUMP
========================================================= */

function jump(){

  if(!started || ended) return;

  if(
    camera.position.y <=
    GROUND_Y+.08
  ){

    jumpVelocity=JUMP_POWER;

  }

}


/* =========================================================
   MOBILE FIRE
   ★ FIRE 버튼을 누르고 있는 동안 연사
========================================================= */

const fireBtn=
  document.getElementById("fireBtn");


/*
  pointer-events 대신 touch 이벤트를 사용하되
  touch identifier를 기억한다.

  이 덕분에:

  손가락 1 = FIRE
  손가락 2 = 화면 조준

  형태의 멀티터치가 가능하다.
*/

let fireTouchId=null;

fireBtn.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    if(!started || ended) return;

    const t=e.changedTouches[0];

    fireTouchId=t.identifier;

    firing=true;

    /*
      첫 발은 즉시 발사
    */
    shoot();

  },
  {passive:false}
);

fireBtn.addEventListener(
  "touchend",
  e=>{

    e.preventDefault();

    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===
        fireTouchId
      ){

        fireTouchId=null;
        firing=false;

      }

    }

  },
  {passive:false}
);

fireBtn.addEventListener(
  "touchcancel",
  e=>{

    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===
        fireTouchId
      ){

        fireTouchId=null;
        firing=false;

      }

    }

  },
  {passive:false}
);


/* =========================================================
   MOBILE RELOAD
========================================================= */

document
  .getElementById("reloadBtn")
  .addEventListener(
    "touchstart",
    e=>{

      e.preventDefault();

      reload();

    },
    {passive:false}
  );


/* =========================================================
   MOBILE RUN
========================================================= */

document
  .getElementById("runBtn")
  .addEventListener(
    "touchstart",
    e=>{

      e.preventDefault();

      running=true;

    },
    {passive:false}
  );

document
  .getElementById("runBtn")
  .addEventListener(
    "touchend",
    e=>{

      e.preventDefault();

      running=false;

    },
    {passive:false}
  );

document
  .getElementById("runBtn")
  .addEventListener(
    "touchcancel",
    e=>{

      running=false;

    }
  );


/* =========================================================
   MOBILE JUMP
========================================================= */

document
  .getElementById("jumpBtn")
  .addEventListener(
    "touchstart",
    e=>{

      e.preventDefault();

      jump();

    },
    {passive:false}
  );


/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const joystick=
  document.getElementById("joystick");

const knob=
  document.getElementById("joystickKnob");

joystick.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    const t=e.changedTouches[0];

    joystickTouchId=t.identifier;

    updateJoystick(
      t.clientX,
      t.clientY
    );

  },
  {passive:false}
);

joystick.addEventListener(
  "touchmove",
  e=>{

    e.preventDefault();

    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===
        joystickTouchId
      ){

        updateJoystick(
          t.clientX,
          t.clientY
        );

      }

    }

  },
  {passive:false}
);

joystick.addEventListener(
  "touchend",
  e=>{

    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===
        joystickTouchId
      ){

        joystickTouchId=null;

        joyX=0;
        joyY=0;

        knob.style.left="40px";
        knob.style.top="40px";

      }

    }

  }
);

joystick.addEventListener(
  "touchcancel",
  ()=>{
    
    joystickTouchId=null;

    joyX=0;
    joyY=0;

    knob.style.left="40px";
    knob.style.top="40px";

  }
);

function updateJoystick(x,y){

  const r=
    joystick.getBoundingClientRect();

  const cx=
    r.left+r.width/2;

  const cy=
    r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=42;

  const len=
    Math.sqrt(dx*dx+dy*dy);

  if(len>max){

    dx=
      dx/len*max;

    dy=
      dy/len*max;

  }

  joyX=dx/max;
  joyY=dy/max;

  knob.style.left=
    (40+dx)+"px";

  knob.style.top=
    (40+dy)+"px";

}


/* =========================================================
   MOBILE LOOK
   ★ 멀티터치 조준
========================================================= */

/*
  FIRE 버튼은 #mobile 영역에 있기 때문에
  canvas의 touch 이벤트를 막지 않는다.

  따라서:

  손가락 1 → FIRE
  손가락 2 → canvas 오른쪽 → AIM

  동시 사용 가능.
*/

canvas.addEventListener(
  "touchstart",
  e=>{

    if(!started || ended) return;

    for(
      const t of e.changedTouches
    ){

      /*
        왼쪽 조이스틱 영역은 제외
      */

      if(
        t.clientX <
        window.innerWidth*.42
      ){

        continue;

      }

      /*
        이미 다른 조준 손가락이 있으면
        새 손가락으로 덮어쓰지 않는다.
      */

      if(
        lookTouchId!==null
      ){

        continue;

      }

      lookTouchId=t.identifier;

      lastLookX=t.clientX;
      lastLookY=t.clientY;

    }

  },
  {passive:false}
);

canvas.addEventListener(
  "touchmove",
  e=>{

    if(!started || ended) return;

    e.preventDefault();

    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===
        lookTouchId
      ){

        const dx=
          t.clientX-lastLookX;

        const dy=
          t.clientY-lastLookY;

        /*
          좌우 시야
        */

        camera.rotation.y +=
          dx*.004;

        /*
          위아래 시야
        */

        camera.rotation.x +=
          dy*.004;

        camera.rotation.x =
          Math.max(
            -1.45,
            Math.min(
              1.45,
              camera.rotation.x
            )
          );

        lastLookX=t.clientX;
        lastLookY=t.clientY;

      }

    }

  },
  {passive:false}
);

canvas.addEventListener(
  "touchend",
  e=>{

    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===
        lookTouchId
      ){

        lookTouchId=null;

      }

    }

  }
);

canvas.addEventListener(
  "touchcancel",
  e=>{

    for(
      const t of e.changedTouches
    ){

      if(
        t.identifier===
        lookTouchId
      ){

        lookTouchId=null;

      }

    }

  }
);


/* =========================================================
   RECOIL
   ★ 새로 추가
========================================================= */

function applyRecoil(){

  /*
    연사 중 한 발마다 위쪽 반동을 누적한다.
  */

  recoilTarget +=
    RECOIL_PER_SHOT;

  recoilTarget=
    Math.min(
      recoilTarget,
      MAX_RECOIL
    );

  /*
    좌우는 아주 조금만 랜덤하게 흔든다.
  */

  recoilYaw +=
    (Math.random()-.5)*
    RECOIL_SIDE;

}


/*
  매 프레임 호출.
*/
function updateRecoil(dt){

  /*
    목표 반동으로 부드럽게 이동
  */

  const difference=
    recoilTarget-recoilPitch;

  recoilPitch +=
    difference*
    Math.min(
      1,
      RECOIL_RETURN_SPEED*dt
    );


  /*
    발사를 멈추면 목표 반동을
    천천히 0으로 되돌린다.
  */

  if(!firing){

    recoilTarget=
      Math.max(
        0,
        recoilTarget-
        2.8*dt
      );

  }


  /*
    좌우 반동도 천천히 복귀
  */

  recoilYaw +=
    (0-recoilYaw)*
    Math.min(
      1,
      12*dt
    );


  /*
    중요한 부분.

    camera.rotation.x 자체를 계속 누적시키지 않고
    이번 프레임의 반동값을 적용한다.

    Babylon에서는 화면을 위로 올리기 위해
    rotation.x에서 recoilPitch를 빼준다.
  */

  /*
    이전 프레임에서 적용했던 반동을 먼저 제거하고
    현재 반동을 다시 적용해야 한다.
  */

  camera.rotation.x +=
    -recoilPitch;


  /*
    위 코드는 매 프레임 누적 문제가 생길 수 있으므로
    아래에서 다시 현재 반동을 기준으로 보정한다.

    실제 조준 입력과 반동을 분리하기 위해
    recoilApplied 값을 사용한다.
  */

}


/* =========================================================
   RECOIL STATE
   ★ 실제 적용용
========================================================= */

let recoilAppliedPitch=0;
let recoilAppliedYaw=0;


/*
  updateRecoil을 실제 안정적인 방식으로
  다시 정의한다.

  camera.rotation에는 항상
  "플레이어 조준 + 현재 반동"이 들어간다.
*/

function updateRecoilStable(dt){

  /*
    이전 프레임 반동을 제거한다.
  */

  camera.rotation.x -=
    recoilAppliedPitch;

  camera.rotation.y -=
    recoilAppliedYaw;


  /*
    새로운 반동 계산
  */

  recoilPitch +=
    (recoilTarget-recoilPitch)*
    Math.min(
      1,
      RECOIL_RETURN_SPEED*dt
    );


  /*
    발사하지 않는 동안 반동 복귀
  */

  if(!firing){

    recoilTarget=
      Math.max(
        0,
        recoilTarget-
        2.8*dt
      );

  }


  /*
    좌우 반동 복귀
  */

  recoilYaw +=
    (0-recoilYaw)*
    Math.min(
      1,
      12*dt
    );


  /*
    현재 반동 적용
  */

  recoilAppliedPitch=
    -recoilPitch;

  recoilAppliedYaw=
    recoilYaw;

  camera.rotation.x +=
    recoilAppliedPitch;

  camera.rotation.y +=
    recoilAppliedYaw;


  /*
    카메라 상하 한계
  */

  camera.rotation.x =
    Math.max(
      -1.45,
      Math.min(
        1.45,
        camera.rotation.x
      )
    );

}


/* =========================================================
   RELOAD
========================================================= */

function reload(){

  if(!started || ended) return;

  if(reloading) return;

  if(ammo>=MAG_SIZE) return;

  if(reserve<=0) return;

  reloading=true;

  /*
    재장전 중에는 발사 중지
  */

  firing=false;

  setTimeout(
    ()=>{

      if(ended) return;

      const need=
        MAG_SIZE-ammo;

      const load=
        Math.min(
          need,
          reserve
        );

      ammo+=load;
      reserve-=load;

      reloading=false;

      updateHUD();

    },
    800
  );

}


/* =========================================================
   SHOOT
   ★ 실제 발사
========================================================= */

function shoot(){

  if(!started || ended) return;

  if(reloading) return;

  const now=performance.now();

  /*
    FIRE_DELAY보다 빠르게 발사하지 않음
  */

  if(
    now-lastShot <
    FIRE_DELAY
  ) return;

  /*
    탄약 없음
  */

  if(ammo<=0){

    firing=false;

    return;

  }

  lastShot=now;

  ammo--;

  updateHUD();

  /*
    ★ 발사할 때마다 반동
  */

  applyRecoil();

  muzzleFlash();

  performShot();

}


/* =========================================================
   CONTINUOUS FIRE LOOP
   ★ 연사 핵심
========================================================= */

function fireLoop(){

  if(
    started &&
    !ended &&
    firing
  ){

    shoot();

  }

}


/* =========================================================
   MUZZLE FLASH
========================================================= */

function muzzleFlash(){

  const flash=
    BABYLON.MeshBuilder.CreateSphere(
      "flash",
      {
        diameter:.16
      },
      scene
    );

  flash.position=
    camera.position.add(
      camera.getDirection(
        BABYLON.Axis.Z
      ).scale(.7)
    );

  const m=
    new BABYLON.StandardMaterial(
      "flashMat",
      scene
    );

  m.emissiveColor=
    new BABYLON.Color3(
      1,
      .7,
      .15
    );

  flash.material=m;

  setTimeout(
    ()=>{

      flash.dispose();

    },
    45
  );

}


/* =========================================================
   HIT MARKER
========================================================= */

function showHit(){

  const h=
    document.getElementById(
      "hitMarker"
    );

  h.style.opacity="1";

  setTimeout(
    ()=>{

      h.style.opacity="0";

    },
    80
  );

}


/* =========================================================
   SHOOT RAY
========================================================= */

function performShot(){

  const origin=
    camera.position.clone();

  const direction=
    camera.getDirection(
      BABYLON.Axis.Z
    );

  const ray=
    new BABYLON.Ray(
      origin,
      direction,
      100
    );

  const pick=
    scene.pickWithRay(
      ray,
      mesh=>{

        return (
          mesh &&
          (
            mesh.metadata &&
            mesh.metadata.enemyPart
          )
        );

      }
    );

  if(
    pick &&
    pick.hit &&
    pick.pickedMesh
  ){

    const part=
      pick.pickedMesh;

    const enemy=
      part.metadata.enemy;

    if(enemy){

      let damage=34;

      /*
        머리 = 한 방
        몸통 = 34
      */

      if(
        part.metadata.enemyPart===
        "head"
      ){

        damage=100;

      }

      enemy.hp-=damage;

      showHit();

      if(enemy.hp<=0){

        killEnemy(enemy);

      }

    }

  }

}


/* =========================================================
   ENEMY
========================================================= */

const spawnPoints=[
  [-22,-25],
  [22,-25],
  [-28,0],
  [28,0],
  [-20,23],
  [20,23],
  [0,-32],
  [0,32]
];


function createEnemy(x,z){

  const body=
    BABYLON.MeshBuilder.CreateBox(
      "enemyBody",
      {
        width:1,
        height:1.8,
        depth:.65
      },
      scene
    );

  body.position.set(
    x,
    .9,
    z
  );

  body.material=enemyMat;

  body.metadata={
    enemyPart:"body"
  };


  const head=
    BABYLON.MeshBuilder.CreateSphere(
      "enemyHead",
      {
        diameter:.65
      },
      scene
    );

  head.position.set(
    x,
    2.05,
    z
  );

  head.material=enemyHeadMat;

  head.metadata={
    enemyPart:"head"
  };


  const enemy={
    body,
    head,
    hp:100,
    speed:1+Math.random()*.5,
    attackTimer:0,
    dead:false
  };


  body.metadata.enemy=enemy;
  head.metadata.enemy=enemy;

  enemies.push(enemy);

}


/* =========================================================
   SPAWN ROUND
========================================================= */

function spawnRound(){

  enemies.forEach(
    e=>{

      e.body.dispose();
      e.head.dispose();

    }
  );

  enemies=[];

  const count=
    Math.min(
      3+round,
      spawnPoints.length
    );

  for(
    let i=0;
    i<count;
    i++
  ){

    const p=
      spawnPoints[i];

    createEnemy(
      p[0],
      p[1]
    );

  }

  updateHUD();

}


/* =========================================================
   ENEMY DEATH
========================================================= */

function killEnemy(enemy){

  if(enemy.dead) return;

  enemy.dead=true;

  let t=0;

  const interval=
    setInterval(
      ()=>{

        t+=.1;

        enemy.body.position.y-=.08;

        enemy.head.position.y-=.08;

        enemy.body.scaling.y=
          Math.max(
            .1,
            1-t
          );

        if(t>=1){

          clearInterval(interval);

          enemy.body.dispose();
          enemy.head.dispose();

          const index=
            enemies.indexOf(enemy);

          if(index!==-1){

            enemies.splice(
              index,
              1
            );

          }

          updateHUD();

          if(enemies.length===0){

            nextRound();

          }

        }

      },
      40
    );

}


/* =========================================================
   NEXT ROUND
========================================================= */

function nextRound(){

  setTimeout(
    ()=>{

      if(!started || ended) return;

      round++;

      ammo=MAG_SIZE;

      reserve=
        Math.min(
          120,
          reserve+24
        );

      hp=
        Math.min(
          100,
          hp+25
        );

      spawnRound();

      updateHUD();

    },
    1200
  );

}


/* =========================================================
   ENEMY AI
========================================================= */

function updateEnemies(dt){

  if(!started || ended) return;

  for(
    const enemy of enemies
  ){

    if(enemy.dead) continue;

    const pos=
      enemy.body.position;

    const target=
      camera.position;

    const dx=
      target.x-pos.x;

    const dz=
      target.z-pos.z;

    const distance=
      Math.sqrt(
        dx*dx+
        dz*dz
      );

    if(distance>8){

      const nx=
        dx/distance;

      const nz=
        dz/distance;

      pos.x+=
        nx*
        enemy.speed*
        dt;

      pos.z+=
        nz*
        enemy.speed*
        dt;

      enemy.head.position.x=
        pos.x;

      enemy.head.position.z=
        pos.z;

    }
    else{

      enemy.attackTimer-=dt;

      if(
        enemy.attackTimer<=0
      ){

        enemy.attackTimer=.8;

        const damage=
          4+
          Math.floor(
            Math.random()*7
          );

        hp-=damage;

        hp=
          Math.max(
            0,
            hp
          );

        updateHUD();

        if(hp<=0){

          finish(false);

          return;

        }

      }

    }

  }

}


/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(dt){

  if(!started || ended) return;

  let forward=0;
  let side=0;

  if(keys["KeyW"]) forward+=1;
  if(keys["KeyS"]) forward-=1;

  if(keys["KeyA"]) side-=1;
  if(keys["KeyD"]) side+=1;


  /* mobile joystick */

  forward+=-joyY;
  side+=joyX;


  const length=
    Math.sqrt(
      forward*forward+
      side*side
    );

  if(length>1){

    forward/=length;
    side/=length;

  }


  const speed=
    running ?
    RUN_SPEED :
    WALK_SPEED;


  const forwardDir=
    camera.getDirection(
      BABYLON.Axis.Z
    );

  const rightDir=
    camera.getDirection(
      BABYLON.Axis.X
    );


  const move=
    forwardDir.scale(
      forward*speed*dt
    ).add(
      rightDir.scale(
        side*speed*dt
      )
    );


  camera.cameraDirection.x=
    move.x;

  camera.cameraDirection.z=
    move.z;


  /* jump */

  jumpVelocity-=
    GRAVITY*dt;

  camera.cameraDirection.y=
    jumpVelocity*dt;


  if(
    camera.position.y<=
    GROUND_Y
  ){

    camera.position.y=
      GROUND_Y;

    if(jumpVelocity<0){

      jumpVelocity=0;

    }

  }

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  document.getElementById(
    "round"
  ).textContent=
    "ROUND "+round;

  document.getElementById(
    "enemyCount"
  ).textContent=
    "ENEMIES: "+enemies.length;

  document.getElementById(
    "ammo"
  ).textContent=
    ammo+" / "+reserve;

  document.getElementById(
    "hp"
  ).textContent=
    "HP "+hp;

}


/* =========================================================
   FINISH
========================================================= */

function finish(victory){

  if(ended) return;

  ended=true;

  started=false;

  firing=false;

  /*
    반동도 초기화
  */

  recoilPitch=0;
  recoilTarget=0;
  recoilYaw=0;
  recoilAppliedPitch=0;
  recoilAppliedYaw=0;

  const screen=
    document.getElementById(
      "endScreen"
    );

  const title=
    document.getElementById(
      "endTitle"
    );

  title.textContent=
    victory ?
    "VICTORY" :
    "YOU DIED";

  screen.style.display="flex";

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

  document
    .getElementById("menu")
    .style.display="none";

  document
    .getElementById("endScreen")
    .style.display="none";

  started=true;

  ended=false;

  round=1;

  hp=100;

  ammo=MAG_SIZE;

  reserve=60;

  firing=false;

  reloading=false;

  jumpVelocity=0;

  lastShot=0;

  /*
    ★ 반동 초기화
  */

  recoilPitch=0;
  recoilTarget=0;
  recoilYaw=0;
  recoilAppliedPitch=0;
  recoilAppliedYaw=0;

  camera.position=
    new BABYLON.Vector3(
      0,
      GROUND_Y,
      28
    );

  camera.rotation=
    new BABYLON.Vector3(
      0,
      0,
      0
    );

  spawnRound();

  updateHUD();

  canvas.requestPointerLock?.();

}


/* =========================================================
   RESTART
========================================================= */

document
  .getElementById("startButton")
  .addEventListener(
    "click",
    startGame
  );

document
  .getElementById("restartButton")
  .addEventListener(
    "click",
    startGame
  );


/* =========================================================
   MAIN LOOP
========================================================= */

let lastTime=
  performance.now();

engine.runRenderLoop(
  ()=>{

    const now=
      performance.now();

    let dt=
      (now-lastTime)/1000;

    lastTime=now;

    dt=
      Math.min(
        dt,
        .05
      );


    /* movement */

    updateMovement(dt);


    /* enemies */

    updateEnemies(dt);


    /*
      ★ 연사
    */

    fireLoop();


    /*
      ★ 반동

      반드시 카메라 입력과 함께 매 프레임
      갱신한다.
    */

    updateRecoilStable(dt);


    /* render */

    scene.render();

  }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{
    engine.resize();
  }
);


/* =========================================================
   INITIAL
========================================================= */

updateHUD();

</script>
