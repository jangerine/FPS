<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VECTOR 3D TEST</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
}

#game{
    position:fixed;
    inset:0;
}

#info{
    position:fixed;
    z-index:10;
    top:20px;
    left:20px;
    padding:15px 20px;
    background:#000c;
    color:white;
    font-family:Arial,sans-serif;
    font-size:16px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="info">
VECTOR 3D TEST<br>
화면에 큐브가 보이면 3D 정상
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

<script>

console.log("Three:", THREE);


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x2874a6);


/* =========================
   CAMERA
========================= */

const camera =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

camera.position.set(
    0,
    2,
    8
);

camera.lookAt(
    0,
    1,
    0
);


/* =========================
   RENDERER
========================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true,
        alpha:false
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio || 1,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setClearColor(
    0x2874a6,
    1
);

document
    .getElementById("game")
    .appendChild(renderer.domElement);


/* =========================
   LIGHT
========================= */

const light =
    new THREE.HemisphereLight(
        0xffffff,
        0x444444,
        3
    );

scene.add(light);


/* =========================
   GIANT CUBE
========================= */

const cube =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            3,
            3,
            3
        ),
        new THREE.MeshBasicMaterial({
            color:0xff3333
        })
    );

cube.position.set(
    0,
    1,
    0
);

scene.add(cube);


/* =========================
   FLOOR
========================= */

const floor =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            30,
            30
        ),
        new THREE.MeshBasicMaterial({
            color:0x555555
        })
    );

floor.rotation.x =
    -Math.PI / 2;

scene.add(floor);


/* =========================
   GRID
========================= */

const grid =
    new THREE.GridHelper(
        30,
        30,
        0xffffff,
        0x777777
    );

grid.position.y =
    0.01;

scene.add(grid);


/* =========================
   ANIMATION
========================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    cube.rotation.x += 0.01;
    cube.rotation.y += 0.015;

    renderer.render(
        scene,
        camera
    );
}

animate();


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
