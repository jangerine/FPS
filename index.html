<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>VECTOR FPS</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

#renderCanvas{
  width:100%;
  height:100%;
  display:block;
  outline:none;
}

/* =========================================================
   HUD
========================================================= */

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:white;
  z-index:10;
}

#topHud{
  position:absolute;
  top:15px;
  left:15px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.hudBox{
  background:rgba(0,0,0,.58);
  border:1px solid rgba(255,255,255,.25);
  border-radius:8px;
  padding:7px 11px;
  font-weight:bold;
  text-shadow:0 2px 4px #000;
}

#healthBox{
  position:absolute;
  left:18px;
  bottom:18px;
  width:190px;
}

#healthLabel{
  font-size:14px;
  margin-bottom:5px;
  text-shadow:0 2px 4px #000;
}

#healthBarOuter{
  width:100%;
  height:18px;
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.35);
  border-radius:5px;
  overflow:hidden;
}

#healthBar{
  height:100%;
  width:100%;
  background:#39e75f;
  transition:width .15s;
}

#ammoBox{
  position:absolute;
  right:18px;
  bottom:18px;
  background:rgba(0,0,0,.65);
  border:1px solid rgba(255,255,255,.3);
  border-radius:10px;
  padding:10px 15px;
  text-align:right;
  text-shadow:0 2px 4px #000;
}

#ammo{
  font-size:30px;
  font-weight:bold;
}

#reserve{
  font-size:15px;
  opacity:.8;
}

/* =========================================================
   CROSSHAIR
========================================================= */

#crosshair{
  position:absolute;
  left:50%;
  top:50%;
  width:22px;
  height:22px;
  transform:translate(-50%,-50%);
}

.cross{
  position:absolute;
  background:white;
  box-shadow:0 0 3px #000;
}

.cross.h{
  left:0;
  top:10px;
  width:22px;
  height:2px;
}

.cross.v{
  left:10px;
  top:0;
  width:2px;
  height:22px;
}

/* =========================================================
   HIT MARKER
========================================================= */

#hitMarker{
  position:absolute;
  left:50%;
  top:50%;
  width:28px;
  height:28px;
  transform:translate(-50%,-50%);
  opacity:0;
}

.hitLine{
  position:absolute;
  width:28px;
  height:2px;
  top:13px;
  left:0;
  background:#ff4040;
  box-shadow:0 0 5px #000;
}

.hitLine.a{
  transform:rotate(45deg);
}

.hitLine.b{
  transform:rotate(-45deg);
}

/* =========================================================
   START SCREEN
========================================================= */

#startScreen{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(
      circle at center,
      rgba(40,40,40,.45),
      rgba(0,0,0,.97)
    );
  color:white;
}

.startPanel{
  width:min(92%,460px);
  padding:32px;
  text-align:center;
  background:rgba(10,10,10,.93);
  border:1px solid rgba(255,255,255,.2);
  border-radius:16px;
  box-shadow:0 20px 80px rgba(0,0,0,.8);
}

.logo{
  font-size:42px;
  font-weight:900;
  letter-spacing:5px;
  margin-bottom:6px;
}

.subtitle{
  opacity:.55;
  margin-bottom:25px;
}

/* =========================================================
   MODE SELECT
========================================================= */

.modeTitle{
  font-size:13px;
  opacity:.65;
  margin-bottom:10px;
}

.modeButtons{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.modeButton{
  flex:1;
  padding:14px 8px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.25);
  background:#222;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.modeButton.selected{
  background:white;
  color:#111;
}

.modeDescription{
  min-height:42px;
  font-size:12px;
  opacity:.65;
  line-height:1.5;
  margin-bottom:18px;
}

#startButton{
  width:100%;
  padding:16px;
  border:0;
  border-radius:8px;
  background:#fff;
  color:#111;
  font-size:19px;
  font-weight:bold;
  cursor:pointer;
}

#startButton:active{
  transform:scale(.98);
}

/* =========================================================
   END SCREEN
========================================================= */

#endScreen{
  position:fixed;
  inset:0;
  z-index:90;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.82);
  color:white;
}

.endPanel{
  width:min(90%,420px);
  text-align:center;
  background:#111;
  border:1px solid #555;
  border-radius:14px;
  padding:30px;
}

#endTitle{
  font-size:38px;
  font-weight:bold;
  margin-bottom:20px;
}

#endStats{
  font-size:18px;
  line-height:1.8;
  margin-bottom:25px;
  opacity:.85;
}

#restartButton{
  border:0;
  border-radius:8px;
  padding:14px 25px;
  background:white;
  color:#111;
  font-size:17px;
  font-weight:bold;
}

/* =========================================================
   MOBILE CONTROLS
========================================================= */

#mobileControls{
  display:none;
  position:fixed;
  inset:0;
  z-index:20;
  pointer-events:none;
}

#joystickZone{
  position:absolute;
  left:15px;
  bottom:25px;
  width:150px;
  height:150px;
  pointer-events:auto;
}

#joystickBase{
  position:absolute;
  left:25px;
  top:25px;
  width:100px;
  height:100px;
  border-radius:50%;
  background:rgba(255,255,255,.13);
  border:2px solid rgba(255,255,255,.35);
}

#joystickKnob{
  position:absolute;
  left:52px;
  top:52px;
  width:46px;
  height:46px;
  margin-left:-23px;
  margin-top:-23px;
  border-radius:50%;
  background:rgba(255,255,255,.5);
  border:2px solid rgba(255,255,255,.7);
}

.mobileButton{
  position:absolute;
  pointer-events:auto;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.45);
  background:rgba(0,0,0,.45);
  color:white;
  font-weight:bold;
  text-align:center;
  user-select:none;
  display:flex;
  align-items:center;
  justify-content:center;
}

.mobileButton:active{
  background:rgba(255,255,255,.25);
}

#fireButton{
  right:25px;
  bottom:90px;
  width:90px;
  height:90px;
  background:rgba(180,30,30,.5);
  font-size:18px;
}

#reloadButton{
  right:25px;
  bottom:190px;
  width:65px;
  height:65px;
}

#runButton{
  right:120px;
  bottom:25px;
  width:65px;
  height:65px;
}

#jumpButton{
  right:105px;
  bottom:150px;
  width:65px;
  height:65px;
}

/* =========================================================
   MOBILE LOOK
========================================================= */

#lookZone{
  position:absolute;
  right:0;
  top:0;
  width:55%;
  height:100%;
  pointer-events:auto;
}

@media(pointer:coarse){

  #mobileControls{
    display:block;
  }

  #topHud{
    top:8px;
    left:8px;
    gap:5px;
  }

  .hudBox{
    padding:5px 7px;
    font-size:12px;
  }

  #ammoBox{
    right:10px;
    bottom:10px;
  }

  #healthBox{
    left:10px;
    bottom:10px;
  }

}

</style>
</head>

<body>

<canvas id="renderCanvas"></canvas>

<!-- =====================================================
     HUD
===================================================== -->

<div id="hud">

  <div id="topHud">

    <div class="hudBox">
      MODE <span id="modeText">ROUND</span>
    </div>

    <div class="hudBox" id="roundBox">
      ROUND <span id="round">1</span>
    </div>

    <div class="hudBox">
      ENEMIES <span id="enemyCount">0</span>
    </div>

    <div class="hudBox" id="killsBox">
      KILLS <span id="kills">0</span>
    </div>

    <div class="hudBox" id="timerBox">
      TIME <span id="timer">--:--</span>
    </div>

  </div>

  <div id="crosshair">
    <div class="cross h"></div>
    <div class="cross v"></div>
  </div>

  <div id="hitMarker">
    <div class="hitLine a"></div>
    <div class="hitLine b"></div>
  </div>

  <div id="healthBox">

    <div id="healthLabel">
      HP <span id="hpText">100</span>
    </div>

    <div id="healthBarOuter">
      <div id="healthBar"></div>
    </div>

  </div>

  <div id="ammoBox">

    <div id="ammo">12</div>

    <div id="reserve">
      / 60
    </div>

  </div>

</div>

<!-- =====================================================
     START SCREEN
===================================================== -->

<div id="startScreen">

  <div class="startPanel">

    <div class="logo">
      VECTOR
    </div>

    <div class="subtitle">
      TACTICAL FPS
    </div>

    <div class="modeTitle">
      GAME MODE
    </div>

    <div class="modeButtons">

      <button
        class="modeButton selected"
        id="roundModeButton"
      >
        ROUND
      </button>

      <button
        class="modeButton"
        id="deathmatchModeButton"
      >
        DEATHMATCH
      </button>

    </div>

    <div
      class="modeDescription"
      id="modeDescription"
    >
      적을 모두 처치하면 다음 라운드로 진행합니다.
    </div>

    <button id="startButton">
      START GAME
    </button>

    <div style="
      margin-top:20px;
      font-size:12px;
      opacity:.55;
      line-height:1.8;
    ">
      PC: WASD / Mouse / Shift / Space / R<br>
      Mobile: Joystick / Touch Look / FIRE / RUN / JUMP / RELOAD

  </div>

</div>

<!-- =====================================================
     END SCREEN
===================================================== -->

<div id="endScreen">

  <div class="endPanel">

    <div id="endTitle">
      MATCH END
    </div>

    <div id="endStats">
      KILLS: 0
    </div>

    <button id="restartButton">
      PLAY AGAIN
    </button>

  </div>

</div>

<!-- =====================================================
     MOBILE
===================================================== -->

<div id="mobileControls">

  <div id="lookZone"></div>

  <div id="joystickZone">

    <div id="joystickBase"></div>

    <div id="joystickKnob"></div>

  </div>

  <div
    id="fireButton"
    class="mobileButton"
  >
    FIRE
  </div>

  <div
    id="reloadButton"
    class="mobileButton"
  >
    R
  </div>

  <div
    id="runButton"
    class="mobileButton"
  >
    RUN
  </div>

  <div
    id="jumpButton"
    class="mobileButton"
  >
    JUMP
  </div>

</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>

<script>

/* =========================================================
   VECTOR FPS
   ROUND + DEATHMATCH
========================================================= */

const canvas=
  document.getElementById(
    "renderCanvas"
  );

const engine=
  new BABYLON.Engine(
    canvas,
    true,
    {
      preserveDrawingBuffer:true,
      stencil:true
    }
  );

let scene;
let camera;

/* =========================================================
   GAME STATE
========================================================= */

let gameStarted=false;
let gameOver=false;

let gameMode="round";

const DEATHMATCH_TIME=300;
const DEATHMATCH_KILLS=30;

let deathmatchTime=DEATHMATCH_TIME;
let kills=0;

let playerDead=false;
let respawnTimer=0;

/* =========================================================
   ROUND
========================================================= */

let round=1;

/*
  ROUND 전환 예약 중복 방지
*/

let roundTransitionPending=false;

/* =========================================================
   PLAYER
========================================================= */

let playerHP=100;

let ammo=12;
let reserve=60;

const MAG_SIZE=12;

const FIRE_DELAY=145;

let lastShot=0;
let firing=false;
let reloading=false;

/* =========================================================
   MOVEMENT
========================================================= */

const WALK_SPEED=2.1;
const RUN_SPEED=3.4;

const GROUND_Y=1.7;

const JUMP_POWER=3.6;
const GRAVITY=14;

let velocityY=0;
let onGround=true;

let moveForward=false;
let moveBackward=false;
let moveLeft=false;
let moveRight=false;

let running=false;

/* =========================================================
   COLLISION
========================================================= */

const collisionMeshes=[];

const PLAYER_RADIUS=.42;
const ENEMY_RADIUS=.42;

/* =========================================================
   MOBILE
========================================================= */

let joystickX=0;
let joystickY=0;

let joystickActive=false;
let joystickPointerId=null;

let lookActive=false;
let lookPointerId=null;

let lastLookX=0;
let lastLookY=0;

/* =========================================================
   RECOIL
========================================================= */

const RECOIL_PER_SHOT=.035;
const MAX_RECOIL_PITCH=1.35;
const RECOIL_SIDE=.008;

/* =========================================================
   ENEMIES
========================================================= */

let enemies=[];

const DEATHMATCH_ENEMY_COUNT=5;

/* =========================================================
   SPAWN POINTS
========================================================= */

const spawnPoints=[

  [-22,-25],
  [22,-25],

  [-28,0],
  [28,0],

  [-20,23],
  [20,23],

  [0,-32],
  [0,32]

];

/* =========================================================
   MATERIAL
========================================================= */

function mat(name,color){

  const m=
    new BABYLON.StandardMaterial(
      name,
      scene
    );

  m.diffuseColor=
    new BABYLON.Color3(
      color[0],
      color[1],
      color[2]
    );

  return m;
}

/* =========================================================
   COLLISION HELPERS
========================================================= */

function circleHitsMesh(
  x,
  z,
  radius,
  mesh
){

  if(
    !mesh ||
    mesh.isDisposed()
  ){
    return false;
  }

  const halfX=
    mesh.getBoundingInfo()
      .boundingBox
      .extendSizeWorld.x;

  const halfZ=
    mesh.getBoundingInfo()
      .boundingBox
      .extendSizeWorld.z;

  const centerX=
    mesh.getBoundingInfo()
      .boundingBox
      .centerWorld.x;

  const centerZ=
    mesh.getBoundingInfo()
      .boundingBox
      .centerWorld.z;

  const closestX=
    Math.max(
      centerX-halfX,
      Math.min(
        x,
        centerX+halfX
      )
    );

  const closestZ=
    Math.max(
      centerZ-halfZ,
      Math.min(
        z,
        centerZ+halfZ
      )
    );

  const dx=x-closestX;
  const dz=z-closestZ;

  return(
    dx*dx+
    dz*dz
    <
    radius*radius
  );
}

/* =========================================================
   CHECK POSITION
========================================================= */

function blockedAt(
  x,
  z,
  radius
){

  for(
    const mesh of collisionMeshes
  ){

    if(
      circleHitsMesh(
        x,
        z,
        radius,
        mesh
      )
    ){

      return true;

    }

  }

  return false;
}

/* =========================================================
   MOVE WITH COLLISION
========================================================= */

function moveWithCollision(
  position,
  dx,
  dz,
  radius
){

  const nextX=
    position.x+dx;

  const nextZ=
    position.z+dz;

  /*
    X와 Z를 따로 검사해서
    벽에 부딪히면 옆으로 미끄러지게 한다.
  */

  if(
    !blockedAt(
      nextX,
      position.z,
      radius
    )
  ){

    position.x=
      nextX;

  }

  if(
    !blockedAt(
      position.x,
      nextZ,
      radius
    )
  ){

    position.z=
      nextZ;

  }

  /*
    맵 외곽 안전 제한
  */

  position.x=
    Math.max(
      -32,
      Math.min(
        32,
        position.x
      )
    );

  position.z=
    Math.max(
      -32,
      Math.min(
        32,
        position.z
      )
    );

}

/* =========================================================
   CREATE SCENE
========================================================= */

function createScene(){

  scene=
    new BABYLON.Scene(
      engine
    );

  scene.clearColor=
    new BABYLON.Color4(
      .035,
      .045,
      .06,
      1
    );

  /* =====================================================
     CAMERA
  ===================================================== */

  camera=
    new BABYLON.UniversalCamera(
      "playerCamera",
      new BABYLON.Vector3(
        0,
        GROUND_Y,
        -25
      ),
      scene
    );

  camera.minZ=.05;

  camera.fov=.9;

  camera.speed=0;

  /*
    카메라 관성 제거.
    손가락/마우스 움직임을 즉시 반영.
  */

  camera.inertia=0;

  camera.attachControl(
    canvas,
    false
  );

  /* =====================================================
     LIGHT
  ===================================================== */

  const light=
    new BABYLON.HemisphericLight(
      "mainLight",
      new BABYLON.Vector3(
        0,
        1,
        0
      ),
      scene
    );

  light.intensity=1.1;

  const sun=
    new BABYLON.DirectionalLight(
      "sun",
      new BABYLON.Vector3(
        -.4,
        -1,
        -.3
      ),
      scene
    );

  sun.position=
    new BABYLON.Vector3(
      20,
      30,
      20
    );

  sun.intensity=.7;

  /* =====================================================
     MATERIALS
  ===================================================== */

  const floorMat=
    mat(
      "floor",
      [.13,.15,.18]
    );

  const wallMat=
    mat(
      "wall",
      [.92,.92,.92]
    );

  const coverMat=
    mat(
      "cover",
      [.20,.23,.28]
    );

  const enemyBodyMat=
    mat(
      "enemyBody",
      [.75,.12,.12]
    );

  const enemyHeadMat=
    mat(
      "enemyHead",
      [.95,.35,.25]
    );

  /* =====================================================
     FLOOR
  ===================================================== */

  const floor=
    BABYLON.MeshBuilder.CreateGround(
      "floor",
      {
        width:70,
        height:70
      },
      scene
    );

  floor.material=floorMat;

  /* =====================================================
     WALL FUNCTION
  ===================================================== */

  function wall(
    name,
    x,
    y,
    z,
    width,
    height,
    depth
  ){

    const mesh=
      BABYLON.MeshBuilder.CreateBox(
        name,
        {
          width:width,
          height:height,
          depth:depth
        },
        scene
      );

    mesh.position.set(
      x,
      y,
      z
    );

    mesh.material=wallMat;

    /*
      직접 만든 충돌 시스템에 등록
    */

    mesh.checkCollisions=true;

    collisionMeshes.push(
      mesh
    );

    return mesh;
  }

  /* =====================================================
     OUTER WALLS
  ===================================================== */

  wall(
    "northWall",
    0,
    3,
    34,
    68,
    6,
    1
  );

  wall(
    "southWall",
    0,
    3,
    -34,
    68,
    6,
    1
  );

  wall(
    "westWall",
    -34,
    3,
    0,
    1,
    6,
    68
  );

  wall(
    "eastWall",
    34,
    3,
    0,
    1,
    6,
    68
  );

  /* =====================================================
     INTERNAL WALLS
  ===================================================== */

  wall(
    "middleWall",
    0,
    2.5,
    8,
    18,
    5,
    1
  );

  wall(
    "middleWall2",
    0,
    2.5,
    -8,
    18,
    5,
    1
  );

  wall(
    "leftWall",
    -14,
    2.5,
    0,
    1,
    5,
    14
  );

  wall(
    "rightWall",
    14,
    2.5,
    0,
    1,
    5,
    14
  );

  wall(
    "upperWall",
    10,
    2.5,
    18,
    18,
    5,
    1
  );

  wall(
    "lowerWall",
    -10,
    2.5,
    -18,
    18,
    5,
    1
  );

  /* =====================================================
     COVER
  ===================================================== */

  function cover(
    x,
    z,
    w,
    h,
    d
  ){

    const mesh=
      BABYLON.MeshBuilder.CreateBox(
        "cover",
        {
          width:w,
          height:h,
          depth:d
        },
        scene
      );

    mesh.position.set(
      x,
      h/2,
      z
    );

    mesh.material=coverMat;

    /*
      엄폐물도 충돌체로 등록
    */

    mesh.checkCollisions=true;

    collisionMeshes.push(
      mesh
    );

    return mesh;
  }

  cover(-8,5,4,2,2);
  cover(8,5,4,2,2);

  cover(-8,-5,4,2,2);
  cover(8,-5,4,2,2);

  cover(-22,12,5,2,2);
  cover(22,12,5,2,2);

  cover(-22,-12,5,2,2);
  cover(22,-12,5,2,2);

  cover(0,20,5,2,2);
  cover(0,-20,5,2,2);

  return scene;
}

/* =========================================================
   CREATE ENEMY
========================================================= */

function createEnemy(x,z){

  const enemy={

    root:null,

    body:null,

    head:null,

    hp:100,

    dead:false,

    speed:1+Math.random()*.5,

    attackTimer:0,

    deathTimer:0

  };

  const root=
    new BABYLON.TransformNode(
      "enemyRoot",
      scene
    );

  root.position.set(
    x,
    0,
    z
  );

  enemy.root=root;

  /* BODY */

  const body=
    BABYLON.MeshBuilder.CreateBox(
      "enemyBody",
      {
        width:.8,
        height:1.4,
        depth:.55
      },
      scene
    );

  body.parent=root;

  body.position.y=.9;

  body.material=
    scene.getMaterialByName(
      "enemyBody"
    );

  body.metadata={
    enemy:enemy,
    hitPart:"body"
  };

  enemy.body=body;

  /* HEAD */

  const head=
    BABYLON.MeshBuilder.CreateSphere(
      "enemyHead",
      {
        diameter:.55
      },
      scene
    );

  head.parent=root;

  head.position.y=1.85;

  head.material=
    scene.getMaterialByName(
      "enemyHead"
    );

  head.metadata={
    enemy:enemy,
    hitPart:"head"
  };

  enemy.head=head;

  enemies.push(enemy);

  return enemy;
}

/* =========================================================
   FIND SAFE SPAWN
========================================================= */

function getSpawnPoint(){

  const available=
    spawnPoints
      .map(p=>({

        p:p,

        distance:
          Math.hypot(
            p[0]-camera.position.x,
            p[1]-camera.position.z
          )

      }))
      .sort(
        (a,b)=>
          b.distance-a.distance
      );

  const candidates=
    available.slice(
      0,
      Math.min(
        4,
        available.length
      )
    );

  const chosen=
    candidates[
      Math.floor(
        Math.random()*
        candidates.length
      )
    ];

  return chosen.p;
}

/* =========================================================
   START ROUND
========================================================= */

function startRound(){

  roundTransitionPending=false;

  playerHP=100;

  reserve=

  ammo=MAG_SIZE;

  enemies.forEach(
    e=>{

  enemies=[];

  for(

    const p=
      spawnPoints[i];

    createEnemy(
      p[0],
      p[1]

}

/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updateMovement(dt){

  if(
    !gameStarted ||
    gameOver ||
    playerDead
  )return;

  let forward=0;
  let strafe=0;

  if(moveForward)forward+=1;
  if(moveBackward)forward-=1;

  if(moveRight)strafe+=1;
  if(moveLeft)strafe-=1;

  forward+=joystickY;
  strafe+=joystickX;

  const length=
    Math.hypot(
      forward,
      strafe
    );

  if(length>1){

    forward/=length;
    strafe/=length;
  }

  const speed=
    running
      ? RUN_SPEED
      : WALK_SPEED;

  const yaw=
    camera.rotation.y;

  const forwardX=
    Math.sin(yaw);

  const forwardZ=
    Math.cos(yaw);

  const rightX=
    Math.cos(yaw);

  const rightZ=
    -Math.sin(yaw);

  const moveX=
    (
      forwardX*forward+
      rightX*strafe
    )*
    speed*
    dt;

  const moveZ=
    (
      forwardZ*forward+
      rightZ*strafe
    )*
    speed*
    dt;

  /*
    벽/엄폐물 충돌 이동
  */

  moveWithCollision(
    camera.position,
    moveX,
    moveZ,
    PLAYER_RADIUS
  );

  /* =====================================================
     GRAVITY
  ===================================================== */

  velocityY-=
    GRAVITY*dt;

  camera.position.y+=
    velocityY*dt;

  if(
    camera.position.y<=
    GROUND_Y
  ){

    camera.position.y=
      GROUND_Y;

    velocityY=0;

    onGround=true;
  }

  camera.position.x=
    Math.max(
      -32,
      Math.min(
        32,
        camera.position.x
      )
    );

  camera.position.z=
    Math.max(
      -32,
      Math.min(
        32,
        camera.position.z
      )
    );
}

/* =========================================================
   JUMP
========================================================= */

function jump(){

  if(
    !gameStarted ||
    gameOver ||
    playerDead ||
    !onGround
  )return;

  velocityY=
    JUMP_POWER;

  onGround=false;
}

/* =========================================================
   RECOIL
========================================================= */

function applyRecoil(){

  /*
    자동 복귀 없음.

    따라서 연사 중에
    마우스/터치로 화면을 아래로 움직이면
    플레이어가 직접 반동을 잡을 수 있다.
  */

  camera.rotation.x-=
    RECOIL_PER_SHOT;

  camera.rotation.x=
    Math.max(
      -MAX_RECOIL_PITCH,
      Math.min(
        MAX_RECOIL_PITCH,
        camera.rotation.x
      )
    );

  camera.rotation.y+=
    (Math.random()-.5)*
    RECOIL_SIDE;
}

/* =========================================================
   SHOOT
========================================================= */

function shoot(){

  if(
    !gameStarted ||
    gameOver ||
    playerDead ||
    reloading
  )return;

  const now=
    performance.now();

  if(
    now-lastShot<
    FIRE_DELAY
  )return;

  if(ammo<=0){

    reload();

    return;
  }

  lastShot=now;

  ammo--;

  applyRecoil();

  muzzleFlash();

  const ray=
    scene.createPickingRay(
      canvas.width/2,
      canvas.height/2,
      BABYLON.Matrix.Identity(),
      camera
    );

  const hit=
    scene.pickWithRay(
      ray,
      mesh=>{
        return !!(
          mesh.metadata &&
          mesh.metadata.enemy
        );
      }
    );

  if(
    hit &&
    hit.hit &&
    hit.pickedMesh
  ){

    const data=
      hit.pickedMesh.metadata;

    const enemy=
      data.enemy;

    if(
      enemy &&
      !enemy.dead
    ){

      let damage=34;

      if(
        data.hitPart==="head"
      ){

        damage=100;

      }else{

        damage=
          4+
          Math.floor(
            Math.random()*7
          );
      }

      enemy.hp-=damage;

      showHitMarker();

      if(
        enemy.hp<=0
      ){

        killEnemy(enemy);

      }

    }

  }

  updateHUD();
}

/* =========================================================
   FIRE LOOP
========================================================= */

function fireLoop(){

  if(
    !firing ||
    !gameStarted ||
    gameOver ||
    playerDead
  )return;

  shoot();
}

   MUZZLE FLASH
========================================================= */

function muzzleFlash(){

  const flash=

    );

  flash.style.position=
    "fixed";

  flash.style.left="50%";

  flash.style.top="50%";

  flash.style.transform=

  flash.style.pointerEvents=

  flash.style.zIndex="8";

  );

  setTimeout(
    ()=>{
      flash.remove();
    },
    35
  );
}

/* =========================================================
   HIT MARKER
========================================================= */

function showHitMarker(){

  const marker=
    document.getElementById(
      "hitMarker"
    );

  marker.style.opacity="1";

  setTimeout(
    ()=>{
      marker.style.opacity="0";
    },

  );
}

/* =========================================================
   RELOAD
========================================================= */

function reload(){

  if(
    reloading ||
    playerDead ||
    ammo>=MAG_SIZE
  )return;

  if(
    gameMode==="round" &&
    reserve<=0
  )return;

  reloading=true;

  updateHUD();

  setTimeout(
    ()=>{

      if(gameMode==="deathmatch"){

        ammo=MAG_SIZE;

      }else{

        const need=
          MAG_SIZE-ammo;

        const amount=
          Math.min(
            need,
            reserve
          );

        ammo+=amount;

        reserve-=amount;
      }

      reloading=false;

      updateHUD();

    },
    850
  );
}

/* =========================================================
   KILL ENEMY
========================================================= */

function killEnemy(enemy){

  if(
    !enemy ||
    enemy.dead
  )return;

  enemy.dead=true;

  enemy.deathTimer=0;

  if(
    gameMode==="deathmatch"
  ){

    kills++;

    if(
      kills>=DEATHMATCH_KILLS
    ){

      setTimeout(
        ()=>{
          finishDeathmatch(
            "TARGET REACHED"
          );
        },
        350
      );

      return;
    }

    setTimeout(
      ()=>{

        if(
          gameOver ||
          !gameStarted
        )return;

        respawnEnemy(enemy);

      },
      700
    );

  }

}

/* =========================================================
   RESPAWN ENEMY
========================================================= */

function respawnEnemy(enemy){

  if(
    !enemy ||
    !enemy.root
  )return;

  const p=
    getSpawnPoint();

  /*
    스폰 지점이 충돌체 안에 들어가지 않도록
    가능한 위치를 찾는다.
  */

  let spawnX=p[0];
  let spawnZ=p[1];

  if(
    blockedAt(
      spawnX,
      spawnZ,
      ENEMY_RADIUS
    )
  ){

    for(
      const candidate of spawnPoints
    ){

      if(
        !blockedAt(
          candidate[0],
          candidate[1],
          ENEMY_RADIUS
        )
      ){

        spawnX=candidate[0];
        spawnZ=candidate[1];

        break;
      }

    }

  }

  enemy.root.position.set(
    spawnX,
    0,
    spawnZ
  );

  enemy.root.rotation.set(
    0,
    0,
    0
  );

  enemy.hp=100;

  enemy.dead=false;

  enemy.deathTimer=0;

  enemy.attackTimer=0;

  enemy.speed=
    1+
    Math.random()*.5;

  enemy.body.isVisible=true;
  enemy.head.isVisible=true;
}

/* =========================================================
   ENEMY AI
========================================================= */

function updateEnemies(dt){

  if(
    !gameStarted ||
    gameOver ||
    playerDead
  )return;

  enemies.forEach(
    enemy=>{

      if(
        enemy.dead ||
        !enemy.root
      )return;

      const pos=
        enemy.root.position;

      const dx=
        camera.position.x-
        pos.x;

      const dz=
        camera.position.z-
        pos.z;

      const dist=
        Math.hypot(
          dx,
          dz
        );

      if(dist>2.3){

        const dirX=
          dx/dist;

        const dirZ=
          dz/dist;

        const enemyMoveX=
          dirX*
          enemy.speed*
          dt;

        const enemyMoveZ=
          dirZ*
          enemy.speed*
          dt;

        /*
          적도 벽/엄폐물을 통과하지 못한다.
        */

        moveWithCollision(
          pos,
          enemyMoveX,
          enemyMoveZ,
          ENEMY_RADIUS
        );

      }else{

        enemy.attackTimer-=dt;

        if(
          enemy.attackTimer<=0
        ){

          enemy.attackTimer=.8;

          damagePlayer(
            5+
            Math.floor(
              Math.random()*6
            )
          );
        }
      }

      enemy.root.rotation.y=
        Math.atan2(
          dx,
          dz
        );

    }
  );
}

/* =========================================================
   UPDATE DEATHS
========================================================= */

function updateDeaths(dt){

  enemies.forEach(
    enemy=>{

      if(
        !enemy.dead ||
        !enemy.root
      )return;

      enemy.deathTimer+=dt;

      enemy.root.rotation.z=
        Math.min(
          Math.PI/2,
          enemy.deathTimer*5
        );

      enemy.root.position.y=
        Math.max(
          -.3,
          enemy.root.position.y-
          dt*.7
        );

      if(
        gameMode==="round" &&
        enemy.deathTimer>1.2
      ){

        enemy.root.dispose();

      }

    }
  );

  if(
    gameMode==="round"
  ){

    enemies=
      enemies.filter(
        enemy=>{

          if(
            !enemy.root
          ){

            return false;
          }

          if(
            enemy.dead &&
            enemy.deathTimer>1.2
          ){

            enemy.root.dispose();

            return false;
          }

          return true;

        }
      );

  }

}

/* =========================================================
   PLAYER DAMAGE
========================================================= */

function damagePlayer(amount){

  if(
    gameOver ||
    !gameStarted ||
    playerDead
  )return;

  playerHP-=amount;

  playerHP=
    Math.max(
      0,
      playerHP
    );

  updateHUD();

  if(
    playerHP<=0
  ){

    if(
      gameMode==="deathmatch"
    ){

      playerDeath();

    }else{

      finishGame();

    }

  }

}

/* =========================================================
   PLAYER DEATH
========================================================= */

function playerDeath(){

  if(playerDead)return;

  playerDead=true;

  firing=false;

  reloading=false;

  respawnTimer=3;

  camera.rotation.z=.15;

}

/* =========================================================
   PLAYER RESPAWN
========================================================= */

function respawnPlayer(){

  playerDead=false;

  playerHP=100;

  ammo=MAG_SIZE;

  reserve=999;

  velocityY=0;

  onGround=true;

  const p=
    getSpawnPoint();

  let spawnX=p[0];
  let spawnZ=p[1];

  if(
    blockedAt(
      spawnX,
      spawnZ,
      PLAYER_RADIUS
    )
  ){

    for(
      const candidate of spawnPoints
    ){

      if(
        !blockedAt(
          candidate[0],
          candidate[1],
          PLAYER_RADIUS
        )
      ){

        spawnX=candidate[0];
        spawnZ=candidate[1];

        break;
      }

    }

  }

  camera.position.set(
    spawnX,
    GROUND_Y,
    spawnZ
  );

  camera.rotation.x=0;

  camera.rotation.z=0;

  updateHUD();
}

/* =========================================================
   UPDATE RESPAWN
========================================================= */

function updateRespawn(dt){

  if(
    gameMode!=="deathmatch" ||
    !playerDead
  )return;

  respawnTimer-=dt;

  if(
    respawnTimer<=0
  ){

    respawnPlayer();

  }

}

/* =========================================================
   DEATHMATCH TIMER
========================================================= */

function updateDeathmatch(dt){

  if(
    gameMode!=="deathmatch" ||
    !gameStarted ||
    gameOver
  )return;

  if(playerDead)return;

  deathmatchTime-=dt;

  if(
    deathmatchTime<=0
  ){

    deathmatchTime=0;

    finishDeathmatch(
      "TIME UP"
    );

  }

}

/* =========================================================
   DEATHMATCH FINISH
========================================================= */

function finishDeathmatch(reason){

  if(gameOver)return;

  gameOver=true;

  firing=false;

  reloading=false;

  let title="MATCH END";

  if(
    reason==="TARGET REACHED"
  ){

    title="TARGET REACHED";

  }else if(
    reason==="TIME UP"
  ){

    title="TIME UP";

  }

  document.getElementById(
    "endTitle"
  ).textContent=title;

  document.getElementById(
    "endStats"
  ).innerHTML=
    `
      KILLS: <b>${kills}</b><br>
      TARGET: ${DEATHMATCH_KILLS}<br>
      TIME: ${formatTime(deathmatchTime)}
    `;

  document.getElementById(
    "endScreen"
  ).style.display="flex";

  try{

    camera.detachControl(
      canvas
    );

  }catch(e){}

}

/* =========================================================
   ROUND CHECK
========================================================= */

function checkRound(){

  if(
    gameMode!=="round" ||
    gameOver ||
    roundTransitionPending
  )return;

  const alive=
    enemies.filter(
      e=>!e.dead
    ).length;

  if(
    alive===0 &&
    enemies.length>0
  ){

    roundTransitionPending=true;

    setTimeout(
      ()=>{

        if(
          gameOver ||
          gameMode!=="round"
        ){

          roundTransitionPending=false;
          return;

        }

        round++;

        startRound();

      },
      1200
    );

  }

}

/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(seconds){

  seconds=
    Math.max(
      0,
      Math.ceil(seconds)
    );

  const minutes=
    Math.floor(
      seconds/60
    );

  const sec=
    seconds%60;

  return(
    String(minutes)
      .padStart(2,"0")
    +
    ":"
    +
    String(sec)
      .padStart(2,"0")
  );
}

/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
  "keydown",
  e=>{

    if(!gameStarted)return;

    switch(e.code){

      case "KeyW":
        moveForward=true;
        break;

      case "KeyS":
        moveBackward=true;
        break;

      case "KeyA":
        moveLeft=true;
        break;

      case "KeyD":
        moveRight=true;
        break;

      case "ShiftLeft":
      case "ShiftRight":
        running=true;
        break;

      case "Space":
        e.preventDefault();
        jump();
        break;

      case "KeyR":
        reload();
        break;

    }

  }
);

window.addEventListener(
  "keyup",
  e=>{

    switch(e.code){

      case "KeyW":
        moveForward=false;
        break;

      case "KeyS":
        moveBackward=false;
        break;

      case "KeyA":
        moveLeft=false;
        break;

      case "KeyD":
        moveRight=false;
        break;

      case "ShiftLeft":
      case "ShiftRight":
        running=false;
        break;

    }

  }
);

/* =========================================================
   MOUSE LOOK
========================================================= */

let mouseLocked=false;

canvas.addEventListener(
  "click",
  ()=>{

    if(
      gameStarted &&
      !gameOver
    ){

      if(
        document.pointerLockElement!==canvas
      ){

        canvas.requestPointerLock();

      }

    }

  }
);

document.addEventListener(
  "pointerlockchange",
  ()=>{

    mouseLocked=
      document.pointerLockElement===
      canvas;

  }
);

document.addEventListener(
  "mousemove",
  e=>{

    if(
      !gameStarted ||
      gameOver ||
      playerDead ||
      !mouseLocked
    )return;

    /*
      마우스 움직임을 즉시 적용.
      반동 자동 복귀 없음.
    */

    camera.rotation.y+=
      e.movementX*.0025;

    camera.rotation.x+=
      e.movementY*.0025;

    camera.rotation.x=
      Math.max(
        -Math.PI/2+.05,
        Math.min(
          Math.PI/2-.05,
          camera.rotation.x
        )
      );

  }
);

/* =========================================================
   MOUSE FIRE
========================================================= */

canvas.addEventListener(
  "mousedown",
  e=>{

    if(
      e.button===0 &&
      gameStarted &&
      !gameOver &&
      !playerDead
    ){

      firing=true;

      shoot();

    }

  }
);

window.addEventListener(
  "mouseup",
  e=>{

    if(
      e.button===0
    ){

      firing=false;

    }

  }
);

/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const joystickZone=
  document.getElementById(
    "joystickZone"
  );

const joystickKnob=
  document.getElementById(
    "joystickKnob"
  );

joystickZone.addEventListener(
  "pointerdown",
  e=>{

    e.stopPropagation();

    if(playerDead)return;

    joystickActive=true;

    joystickPointerId=
      e.pointerId;

    joystickZone.setPointerCapture(
      e.pointerId
    );

    updateJoystick(
      e.clientX,
      e.clientY
    );

  }
);

joystickZone.addEventListener(
  "pointermove",
  e=>{

    e.stopPropagation();

    if(
      !joystickActive ||
      e.pointerId!==joystickPointerId
    )return;

    updateJoystick(
      e.clientX,
      e.clientY
    );

  }
);

function updateJoystick(
  x,
  y
){

  const rect=
    joystickZone.getBoundingClientRect();

  const centerX=
    rect.left+
    rect.width/2;

  const centerY=
    rect.top+
    rect.height/2;

  let dx=
    x-centerX;

  let dy=
    y-centerY;

  const max=50;

  const length=
    Math.hypot(
      dx,
      dy
    );

  if(length>max){

    dx=
      dx/length*
      max;

    dy=
      dy/length*
      max;

  }

  joystickX=
    dx/max;

  joystickY=
    -dy/max;

  joystickKnob.style.transform=
    `translate(${dx}px,${dy}px)`;

}

function resetJoystick(){

  joystickActive=false;

  joystickPointerId=null;

  joystickX=0;

  joystickY=0;

  joystickKnob.style.transform=
    "translate(0,0)";
}

joystickZone.addEventListener(
  "pointerup",
  resetJoystick
);

joystickZone.addEventListener(
  "pointercancel",
  resetJoystick
);

/* =========================================================
   MOBILE LOOK
========================================================= */

const lookZone=
  document.getElementById(
    "lookZone"
  );

lookZone.addEventListener(
  "pointerdown",
  e=>{

    e.stopPropagation();

    if(
      !gameStarted ||
      gameOver ||
      playerDead
    )return;

    lookActive=true;

    lookPointerId=
      e.pointerId;

    lastLookX=e.clientX;

    lastLookY=e.clientY;

    lookZone.setPointerCapture(
      e.pointerId
    );

  }
);

lookZone.addEventListener(
  "pointermove",
  e=>{

    e.stopPropagation();

    if(
      !lookActive ||
      e.pointerId!==lookPointerId
    )return;

    const dx=
      e.clientX-lastLookX;

    const dy=
      e.clientY-lastLookY;

    lastLookX=e.clientX;

    lastLookY=e.clientY;

    /*
      화면을 아래로 움직이면
      카메라가 아래를 보게 된다.

      따라서 연사 반동을
      손가락으로 직접 잡을 수 있다.
    */

    camera.rotation.y+=
      dx*.004;

    camera.rotation.x+=
      dy*.004;

    camera.rotation.x=
      Math.max(
        -Math.PI/2+.05,
        Math.min(
          Math.PI/2-.05,
          camera.rotation.x
        )
      );

  }
);

function stopLook(e){

  if(
    e.pointerId===
    lookPointerId
  ){

    lookActive=false;

    lookPointerId=null;

  }

}

lookZone.addEventListener(
  "pointerup",
  stopLook
);

lookZone.addEventListener(
  "pointercancel",
  stopLook
);

/* =========================================================
   MOBILE FIRE
========================================================= */

const fireButton=
  document.getElementById(
    "fireButton"
  );

fireButton.addEventListener(
  "pointerdown",
  e=>{

    e.stopPropagation();

    if(
      !gameStarted ||
      gameOver ||
      playerDead
    )return;

    firing=true;

    shoot();

  }
);

fireButton.addEventListener(
  "pointerup",
  e=>{

    e.stopPropagation();

    firing=false;

  }
);

fireButton.addEventListener(
  "pointercancel",
  e=>{

    e.stopPropagation();

    firing=false;

  }
);

fireButton.addEventListener(
  "pointerleave",
  e=>{

    e.stopPropagation();

    firing=false;

  }
);

   MOBILE RELOAD
========================================================= */

document.getElementById(
  "reloadButton"
).addEventListener(

    reload();

  }
);

   MOBILE RUN
========================================================= */

  );

runButton.addEventListener(

    e.stopPropagation();

  }
);

runButton.addEventListener(

/* =========================================================
   MOBILE JUMP
========================================================= */

document.getElementById(
  "jumpButton"
).addEventListener(
  "pointerdown",
  e=>{

    e.stopPropagation();

    jump();

  }
);

/* =========================================================
   START
========================================================= */

document.getElementById(
  "startButton"
).addEventListener(
  "click",
  ()=>{

    startMatch();

  }
);

/* =========================================================
   RESTART
========================================================= */

document.getElementById(
  "restartButton"
).addEventListener(
  "click",
  ()=>{

    gameOver=false;

    document.getElementById(
      "endScreen"
    ).style.display="none";

    try{

      camera.attachControl(
        canvas,
        false
      );

    }catch(e){}

    startMatch();

  }
);

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  ()=>{

    engine.resize();

  }
);

/* =========================================================
   CREATE SCENE
========================================================= */

scene=createScene();

/* =========================================================
   RENDER LOOP
========================================================= */

let lastFrame=
  performance.now();

engine.runRenderLoop(
  ()=>{

    const now=
      performance.now();

    let dt=
      (now-lastFrame)/1000;

    lastFrame=now;

    dt=
      Math.min(
        dt,
        .05
      );

    updateMovement(dt);

    updateEnemies(dt);

    updateDeaths(dt);

    updateRespawn(dt);

    updateDeathmatch(dt);

    checkRound();

    fireLoop();

    updateHUD();

    scene.render();

  }
);

</script>
